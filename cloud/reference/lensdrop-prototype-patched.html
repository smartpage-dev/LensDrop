<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LensDrop — live event photo delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --paper:#F6F7F4; --paper-2:#ECEEEA; --paper-3:#E2E5E0;
  --ink:#1C2024; --ink-2:#5A6168; --rule:#D6D9D4;
  --frame:#202326; --frame-ink:#C3C8CC;
  --marker:#D92B26; --live:#12804F; --hold:#A86A08; --edit:#2F5FC4;
  --focus:#2F6FEB; --scrim:rgba(20,22,25,.45);
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15181B; --paper-2:#1D2125; --paper-3:#262B30;
    --ink:#E8EBE7; --ink-2:#A2A9AF; --rule:#2E3338;
    --frame:#060708; --frame-ink:#9AA1A7;
    --marker:#FF5A50; --live:#3CC98A; --hold:#E6A23C; --edit:#86AEFF;
    --focus:#7AA7FF; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15181B; --paper-2:#1D2125; --paper-3:#262B30;
  --ink:#E8EBE7; --ink-2:#A2A9AF; --rule:#2E3338;
  --frame:#060708; --frame-ink:#9AA1A7;
  --marker:#FF5A50; --live:#3CC98A; --hold:#E6A23C; --edit:#86AEFF;
  --focus:#7AA7FF; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.15;font-weight:750}
p{margin:0}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.tiny{font-size:12px}
.wide{font-stretch:125%}
.narrow{font-stretch:75%}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* controls */
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:4px;font-weight:600;font-size:14px;line-height:1.3;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.danger{background:transparent;color:var(--marker);border-color:var(--marker)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:14px;cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.field{display:grid;gap:5px;margin:0 0 14px}
.field>span{font-size:14px;font-weight:600}
.field .hint{font-size:13px;color:var(--ink-2);font-weight:400}
.in{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:8px 10px;min-height:38px;font-size:15px}
.in:focus{border-color:var(--ink);outline:none}
select.in{padding-right:28px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:8px 0;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--ink)}
input[type=range]{accent-color:var(--ink);width:100%}
input[type=color]{width:48px;height:38px;border:1px solid var(--rule);border-radius:4px;padding:2px;background:var(--paper)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* toast + dialog */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);padding:24px;width:min(520px,calc(100% - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:var(--scrim)}
dialog h2{font-stretch:125%;font-size:24px;margin-bottom:16px}
dialog .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* app states */
.state{max-width:560px;margin:12vh auto;padding:0 20px}
.state h1{font-stretch:125%;font-size:36px;font-weight:850;margin-bottom:12px;letter-spacing:-.01em}
.state p{color:var(--ink-2);max-width:60ch}

/* ===== console ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.wordmark{font-weight:850;font-stretch:125%;font-size:21px;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.wordmark svg{width:22px;height:22px}
.album-pick{min-width:0;max-width:340px}
.album-pick select{font-weight:600}
.livecount{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.livecount b{color:var(--ink);font-stretch:75%;font-size:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block;flex:none}
.dot.off{background:var(--ink-2)}
.dot.on{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(18,128,79,.55)}50%{box-shadow:0 0 0 6px rgba(18,128,79,0)}}
.layout{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:calc(100% - 60px)}
.nav{border-right:1px solid var(--rule);padding:14px 0;display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;border:0;background:none;padding:9px 20px;font-size:15px;cursor:pointer;color:var(--ink-2);border-left:3px solid transparent}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);border-left-color:var(--ink);font-weight:650}
.nav .navcount{font-stretch:75%;font-size:13px;margin-left:6px}
.panel{padding:24px 28px 96px;min-width:0}
.panel>h1{font-stretch:125%;font-size:30px;font-weight:850;letter-spacing:-.01em}
.panel>.lede{color:var(--ink-2);margin:6px 0 22px;max-width:70ch}
.sec{margin:30px 0 0}
.sec>h2{font-size:18px;margin-bottom:10px}
@media (max-width:780px){
  .top{padding:8px 14px;gap:10px;position:static}
  .bulk{top:env(safe-area-inset-top,0px)}
  .layout{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule);padding:0;gap:0}
  .nav button{border-left:0;border-bottom:3px solid transparent;padding:11px 14px;white-space:nowrap}
  .nav button[aria-current="page"]{border-bottom-color:var(--ink)}
  .panel{padding:18px 14px 96px}
  .panel>h1{font-size:24px}
}

/* ingest pipeline: a real sequence, so the steps are numbered */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.step{background:var(--paper);padding:14px 16px 16px;min-width:0}
.step h3{font-size:16px;display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.step h3 .n{font-stretch:75%;color:var(--ink-2);font-weight:600;font-size:15px}
.step .check{margin:6px 0}
.step .seg{margin-top:2px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);width:100%}
.step .seg button{border-right:0;background:var(--paper);padding:7px 8px}
.step .seg button[aria-pressed="true"]{background:var(--ink)}
.step .hint{font-size:13px;color:var(--ink-2);margin-top:6px}
@media (max-width:1180px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.pipe{grid-template-columns:1fr}}
.drop{margin-top:18px;border:2px dashed var(--rule);border-radius:6px;padding:36px 20px;text-align:center;transition:background .15s,border-color .15s}
.drop.over{border-color:var(--ink);background:var(--paper-2)}
.drop h2{font-stretch:125%;font-size:24px;font-weight:800;margin-bottom:6px}
.drop p{color:var(--ink-2);margin-bottom:14px}
.q{margin-top:22px}
.q-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.q-head h2{font-size:18px}
.q-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.q-row:first-of-type{border-top:1px solid var(--rule)}
.q-thumb{width:52px;height:36px;background:var(--paper-3);object-fit:cover;display:block}
.q-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-stage{font-size:13px;color:var(--ink-2)}
.q-stage.err{color:var(--marker)}
.q-time{font-stretch:75%;font-size:14px;color:var(--ink-2);text-align:right}
.q-time.live{color:var(--live);font-weight:600}
.ai-line{margin-top:14px;font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* contact sheet */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tools .in{width:auto;min-height:34px;padding:5px 9px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer;line-height:1.3;white-space:nowrap}
.chip .c{font-stretch:75%;color:var(--ink-2);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.75}
.bulk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:12;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:4px;margin-bottom:10px}
.bulk .btn{background:transparent;color:var(--paper);border-color:rgba(255,255,255,.35)}
.bulk .btn:hover{border-color:var(--paper)}
.bulk select{background:var(--ink);color:var(--paper);border:1px solid rgba(255,255,255,.35);border-radius:4px;min-height:30px;font-size:13px;padding:3px 6px}
.bulk b{font-stretch:75%;font-size:16px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));background:var(--frame);padding:8px;border-radius:2px;min-height:120px}
.f{position:relative;padding:8px 8px 28px;cursor:pointer;color:var(--frame-ink);outline-offset:-3px}
.f-img{position:relative;aspect-ratio:3/2;background:#000;overflow:hidden}
.f-img img{width:100%;height:100%;object-fit:contain;display:block}
.f-vid{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:1px 6px;border-radius:2px}
.f-no{position:absolute;left:10px;bottom:6px;font-stretch:75%;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.f-st{position:absolute;right:10px;bottom:7px;font-size:12px;display:flex;align-items:center;gap:5px}
.f-st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-live{color:#5BD69B}.st-review{color:#F0B44C}.st-editing{color:#8DB4FF}.st-hidden{color:#7C8389}
.f-flag{position:absolute;right:6px;top:6px;background:#D92B26;color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:2px;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-sel{position:absolute;top:13px;left:13px;width:18px;height:18px;margin:0;opacity:0;accent-color:#fff;cursor:pointer;z-index:2}
.f:hover .f-sel,.f-sel:checked,.f-sel:focus-visible,.sheet.selecting .f-sel{opacity:1}
.f.sel .f-img{outline:3px solid #fff;outline-offset:2px}
.mk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mk path{fill:none;stroke:#E8322B;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.92}
.sheet-empty{color:var(--frame-ink);padding:40px 20px;text-align:center;grid-column:1/-1}

/* drawer */
.drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:49;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--paper);border-left:1px solid var(--rule);z-index:50;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(102%);transition:transform .22s ease;overscroll-behavior:contain}
.drawer.open{transform:none}
.drawer h2{font-size:21px;font-stretch:125%;font-weight:800}
.drawer .sub{color:var(--ink-2);font-size:14px;margin:2px 0 12px;overflow-wrap:anywhere}
.cmp{position:relative;background:#000;margin:0 -20px 12px;user-select:none;touch-action:pan-y}
.cmp img,.cmp video{display:block;width:100%;max-height:52vh;object-fit:contain}
.cmp .after{position:absolute;inset:0;clip-path:inset(0 0 0 var(--x,50%))}
.cmp .after img{height:100%}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:#fff;pointer-events:none;transform:translateX(-1px)}
.cmp .lbl{position:absolute;bottom:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:2px}
.cmp input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:12px 0}
.meta dt{color:var(--ink-2)}
.meta dd{margin:0;overflow-wrap:anywhere}
.flagtxt{color:var(--marker);font-weight:600}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:13px;border:1px solid var(--rule);border-radius:3px;padding:1px 7px}
.dsec{border-top:1px solid var(--rule);padding-top:14px;margin-top:14px}
.dsec h3{font-size:15px;margin-bottom:8px}

/* brand */
.brand-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media (max-width:1100px){.brand-grid{grid-template-columns:1fr}}
.fs{border:0;padding:0;margin:0 0 26px}
.fs legend{font-size:18px;font-weight:750;padding:0;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.imgfield{display:flex;gap:12px;align-items:center;margin:0 0 14px}
.imgfield .pv{width:96px;height:64px;background:var(--paper-3) center/contain no-repeat;border:1px solid var(--rule);border-radius:3px;flex:none}
.imgfield .pv.cover{background-size:cover}
.imgfield .t{font-size:14px;font-weight:600}
.preview{position:sticky;top:90px;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper)}
.preview .pc{height:110px;background:var(--paper-3) center/cover}
.preview .pt{padding:12px 14px}
.preview .pt h3{font-stretch:125%;font-size:20px;font-weight:850}
.preview .pframe{position:relative;margin:0 14px 14px;aspect-ratio:3/2;background:var(--paper-3) center/cover}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cat{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:3px 4px 3px 11px;font-size:14px}
.cat button{border:0;background:none;cursor:pointer;width:22px;height:22px;border-radius:50%;color:var(--ink-2)}
.cat button:hover{background:var(--paper-3);color:var(--ink)}

/* share */
.share-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
@media (max-width:900px){.share-grid{grid-template-columns:1fr}}
.qrbox{border:1px solid var(--rule);border-radius:4px;padding:18px;background:#fff;color:#111;text-align:center}
.qrbox svg{width:100%;height:auto;display:block}
.qrbox p{font-size:13px;margin-top:8px;color:#444}

/* insights */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.stat{background:var(--paper);padding:14px 16px}
.stat b{display:block;font-stretch:75%;font-size:36px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--ink-2)}
.chart{width:100%;max-width:760px;height:auto;display:block}
.chart rect{fill:var(--ink)}
.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--font)}
.top-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.top-photos figure{margin:0}
.top-photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--paper-3)}
.top-photos figcaption{font-size:13px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:650;background:var(--paper-2);white-space:nowrap}
tr:last-child td{border-bottom:0}

/* blueprint */
.bp{max-width:1100px}
.bp p{max-width:72ch;margin:0 0 12px}
.bp h2{font-size:21px;margin:34px 0 10px}
.bp h3{font-size:16px;margin:20px 0 6px}
.bp table{table-layout:fixed;min-width:760px}
.bp th:nth-child(1){width:19%}.bp th:nth-child(2){width:13%}.bp th:nth-child(3){width:34%}.bp th:nth-child(4){width:34%}
.bp td:first-child{font-weight:600}
.bp .s{white-space:nowrap;font-weight:600}
.s-working{color:var(--live)}.s-partial{color:var(--hold)}.s-planned{color:var(--ink-2)}
.bp ol{padding-left:22px;max-width:76ch}
.bp ol li{margin:0 0 10px}
.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.arch>div{background:var(--paper);padding:12px 14px;font-size:14px}
.arch h4{font-size:15px;margin-bottom:6px}
.arch ul{margin:0;padding-left:18px}
@media (max-width:860px){.arch{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.arch{grid-template-columns:1fr}}

/* ===== guest gallery ===== */
.g{--brand:#1F3A5F;--brand-ink:#fff;min-height:100%}
.g-ad{display:block;background:var(--paper-2);text-align:center}
.g-ad img{display:block;width:100%;max-height:120px;object-fit:cover}
.g-cover{height:clamp(130px,26vw,300px);background:var(--brand) center/cover no-repeat}
.g-cover.empty{height:clamp(40px,7vw,84px)}
.g-head{padding:18px clamp(16px,4vw,44px) 10px;display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.g-logo{height:60px;width:auto;max-width:170px;object-fit:contain;flex:none}
.g-head h1{font-stretch:125%;font-weight:850;font-size:clamp(28px,5vw,48px);letter-spacing:-.015em;line-height:1.04;overflow-wrap:anywhere}
.g-meta{color:var(--ink-2);margin-top:6px}
.g-live{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:6px}
.g-live b{font-stretch:75%;font-size:16px}

.g-grid{display:flex;flex-wrap:wrap;gap:4px;padding:4px clamp(4px,1vw,12px) 24px;--rowh:230px}

.g-item .play{position:absolute;left:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.g-item .play::before{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.g-item .tick{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25)}

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ============================================================
   LensDrop — live event photo delivery (prototype)
   Core: state, capabilities, imaging, EXIF, zip, helpers
   ============================================================ */
const SHARE_BASE = "https://claude.ai/artifact/HqFmAnSab1cxTgPop8LJMm"; // galleries live at SHARE_BASE + "#slug"
const RESERVED = new Set(["settings","sidebar","customize","upgrade","downloads","console","home"]);
const MAX_ZIP = 60;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const blobUrl = (id) => id ? "/_blob/" + id : "";
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : (many || one + "s")}`;

function fmtBytes(n){ if(!n && n!==0) return ""; if(n<1024) return n+" B"; if(n<1048576) return (n/1024).toFixed(0)+" KB"; return (n/1048576).toFixed(1)+" MB"; }
function fmtDate(v){ if(!v) return ""; const d = typeof v === "number" ? new Date(v) : new Date(v + (String(v).length===10 ? "T12:00:00" : "")); if(isNaN(d)) return ""; return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }
function fmtTime(ts){ if(!ts) return ""; return new Date(ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}); }
function timeAgo(ts){ if(!ts) return ""; const s = Math.max(0,(Date.now()-ts)/1000); if(s<10) return "just now"; if(s<60) return `${s|0} s ago`; if(s<3600) return `${(s/60)|0} min ago`; if(s<86400) return `${(s/3600)|0} h ago`; return fmtDate(ts); }
function slugify(t){
  const s = String(t||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s-]/g," ").trim().replace(/[\s_-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40).replace(/-+$/,"");
  return s.length >= 3 ? s : ("album-" + Math.random().toString(36).slice(2,6));
}
function slugProblem(s, selfId){
  if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(s)) return "Use lowercase letters, numbers and single hyphens.";
  if(s.length < 3 || s.length > 40) return "Use 3 to 40 characters.";
  if(RESERVED.has(s) || s.startsWith("comment-")) return "That address is reserved. Pick another.";
  for(const [id,a] of S.albums) if(id!==selfId && a.slug===s) return "Another album already uses this address.";
  return "";
}
function galleryLink(album, pid){ if(!SHARE_BASE || !album) return ""; return SHARE_BASE.replace(/#.*$/,"") + "#" + album.slug + (pid ? "--" + pid : ""); }
function contrastInk(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return "#FFFFFF";
  const n = parseInt(m[1],16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const lin = v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
  const L = 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
  return L > 0.42 ? "#14171A" : "#FFFFFF";
}
function safeLink(u){ try{ const x = new URL(u); return (x.protocol==="https:"||x.protocol==="http:") ? x.href : ""; }catch{ return ""; } }

let toastTimer;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("on"), 2800); }

/* ---------- global state ---------- */
const S = {
  db:null, user:null, assets:null, downloads:null, sample:null, aiLimits:null, aiTier:undefined,
  me:{ id:null, canEdit:false, isOwner:false },
  albums:new Map(), albumsConfirmed:false, albumsSlow:false, albumsError:null,
  route:{ mode:"", slug:"", pid:"" },
  current:null,
  photos:new Map(), photosAlbum:null, photosMode:"", photosUnsub:null, photosConfirmed:false, photosSlow:false, photosError:null, photosFirst:false,
  fresh:new Set(),
  mounted:"",
};

async function cap(name){
  try{ if(!window.claude || typeof window.claude.use !== "function") return null; return await window.claude.use(name); }
  catch{ return null; }
}

let renderQueued = false;
function scheduleRender(){ if(renderQueued) return; renderQueued = true; requestAnimationFrame(()=>{ renderQueued = false; try{ render(); }catch(e){ console.error(e); } }); }

/* ---------- people ---------- */
const Names = {
  map:new Map(), pending:new Set(), timer:null,
  get(id){
    if(!id) return "Someone";
    if(id === S.me.id) return "You";
    if(!this.map.has(id)){ this.want(id); return "Someone"; }
    return this.map.get(id) || "Someone";
  },
  want(id){ this.pending.add(id); clearTimeout(this.timer); this.timer = setTimeout(()=>this.flush(), 60); },
  async flush(){
    if(!S.user){ return; }
    const ids = [...this.pending]; this.pending.clear(); if(!ids.length) return;
    for(const id of ids) this.map.set(id, "");
    try{ const ps = await S.user.profiles(ids); for(const id of ids) this.map.set(id, (ps && ps[id] && ps[id].name) || ""); }catch{}
    Console.refreshNames();
  }
};

/* ---------- album defaults ---------- */
function cfg(album){
  const s = (album && album.settings) || {};
  return {
    publish: s.publish || "live",
    retouch: s.retouch == null ? "natural" : s.retouch,
    cullOn: s.cullOn == null ? true : !!s.cullOn,
    hold: s.hold == null ? true : !!s.hold,
    blur: s.blur == null ? 80 : +s.blur,
    aiTag: s.aiTag == null ? true : !!s.aiTag,
    maxEdge: s.maxEdge || 3200,
  };
}
function brandOf(album){
  const b = (album && album.brand) || {};
  const o = (x)=> x || {};
  return {
    color: b.color || "#1F3A5F",
    coverId: b.coverId || null, logoId: b.logoId || null,
    layout: b.layout || "ratio",
    wm: { mode:o(b.wm).mode || "off", text:o(b.wm).text || "", pos:o(b.wm).pos || "br", size:o(b.wm).size ?? 22, opacity:o(b.wm).opacity ?? 0.7 },
    loading: { on: !!o(b.loading).on, seconds: o(b.loading).seconds ?? 2, imageId: o(b.loading).imageId || null },
    topAd: { imageId: o(b.topAd).imageId || null, link: o(b.topAd).link || "" },
    footAd: { imageId: o(b.footAd).imageId || null, link: o(b.footAd).link || "" },
    card: { on: !!o(b.card).on, name: o(b.card).name || "", studio: o(b.card).studio || "", contact: o(b.card).contact || "", link: o(b.card).link || "" },
  };
}
function catsOf(album){ return Array.isArray(album && album.categories) ? album.categories : []; }
function catName(album, id){ const c = catsOf(album).find(c=>c.id===id); return c ? c.name : ""; }

/* ---------- photo helpers ---------- */
const SERIOUS = ["eyes closed","motion blur","out of focus","cut-off subject","obstructed"];
function flagsOf(p){
  const out = [];
  const c = p.cull || {};
  if(c.blurry) out.push("Blurry");
  if(c.dark) out.push("Too dark");
  if(c.bright) out.push("Too bright");
  if(c.dup) out.push("Duplicate");
  const iss = (p.ai && Array.isArray(p.ai.issues)) ? p.ai.issues.filter(i=>SERIOUS.includes(i)) : [];
  for(const i of iss) out.push(i[0].toUpperCase()+i.slice(1));
  return out;
}
function photoList(){
  const arr = [];
  for(const [id,p] of S.photos) arr.push(Object.assign({ id }, p));
  arr.sort((a,b)=>(a.uploadedAt||0)-(b.uploadedAt||0) || (a.id<b.id?-1:1));
  arr.forEach((p,i)=>p.frame=i+1);
  return arr;
}

/* ---------- subscriptions ---------- */
function watchAlbums(){
  const t = setTimeout(()=>{ if(!S.albumsConfirmed){ S.albumsSlow = true; scheduleRender(); } }, 10000);
  S.db.collection("albums").onSnapshot(snap=>{
    const m = new Map(); for(const d of snap.docs) m.set(d.id, d.data());
    S.albums = m;
    if(!snap.metadata.fromCache){ S.albumsConfirmed = true; S.albumsSlow = false; clearTimeout(t); }
    scheduleRender();
  }, err=>{ clearTimeout(t); S.albumsError = err && err.code || "unavailable"; S.albumsConfirmed = true; scheduleRender(); });
}
function watchPhotos(albumId, mode){
  if(S.photosAlbum === albumId && S.photosMode === mode) return;
  if(S.photosUnsub){ try{ S.photosUnsub(); }catch{} }
  S.photos = new Map(); S.photosAlbum = albumId; S.photosMode = mode; S.photosConfirmed = false; S.photosSlow = false; S.photosError = null; S.photosFirst = false; S.fresh.clear(); S.photosUnsub = null;
  if(!albumId) return;
  let q = S.db.collection(`albums/${albumId}/photos`);
  if(mode === "live") q = q.where("status","==","live");
  const t = setTimeout(()=>{ if(!S.photosConfirmed){ S.photosSlow = true; scheduleRender(); } }, 10000);
  S.photosUnsub = q.onSnapshot(snap=>{
    if(S.photosFirst){ for(const ch of snap.docChanges()) if(ch.type === "added") S.fresh.add(ch.doc.id); }
    S.photosFirst = true;
    const m = new Map(); for(const d of snap.docs) m.set(d.id, d.data());
    S.photos = m;
    if(!snap.metadata.fromCache){ S.photosConfirmed = true; S.photosSlow = false; clearTimeout(t); }
    scheduleRender();
  }, err=>{ clearTimeout(t); S.photosError = err && err.code || "unavailable"; S.photosConfirmed = true; scheduleRender(); });
}
const photoRef = (albumId, pid) => S.db.doc(`albums/${albumId}/photos/${pid}`);
const albumRef = (albumId) => S.db.doc(`albums/${albumId}`);

/* ---------- assets ---------- */
async function uploadBlob(blob, type){
  if(!S.assets) throw { code:"no_assets" };
  const opts = type ? { type } : undefined;
  for(let attempt=0; attempt<2; attempt++){
    try{ return await S.assets.upload(blob, opts); }
    catch(e){
      const code = e && e.code;
      if(attempt===0 && (code==="store_unavailable" || code==="rate_limited")){ await sleep(code==="rate_limited" ? 3000 : 1500); continue; }
      throw e;
    }
  }
}
async function deleteAsset(id){ if(!id || !S.assets) return; try{ await S.assets.delete(id); }catch{} }
function uploadMessage(e){
  const c = e && e.code;
  if(c==="no_assets") return "Uploading needs Editor access to this artifact.";
  if(c==="too_large") return "This file is over the 20 MB limit.";
  if(c==="unsupported_type") return "This file type can’t be stored. Use JPEG, PNG, WebP, MP4 or WebM.";
  if(c==="quota_or_state") return "Storage for this gallery is full. Delete photos you don’t need, then try again.";
  if(c==="rate_limited") return "Uploads are going too fast. Wait a moment and add the file again.";
  if(c==="upstream_auth") return "Your session expired. Reload the page and sign in again.";
  return "The upload didn’t go through. Add the file again.";
}
async function fetchBlob(id){
  try{ const r = await fetch(blobUrl(id)); if(r.ok) return await r.blob(); }catch{}
  const img = await loadImg(blobUrl(id));
  const c = mkCanvas(img.naturalWidth, img.naturalHeight); c.getContext("2d").drawImage(img,0,0);
  return toBlob(c, "image/jpeg", 0.95);
}

/* ---------- canvas + image ---------- */
function mkCanvas(w,h){ const c = document.createElement("canvas"); c.width = Math.max(1,Math.round(w)); c.height = Math.max(1,Math.round(h)); return c; }
function ctx2d(c, read){ return c.getContext("2d", read ? { willReadFrequently:true } : undefined); }
function fit(w,h,max){ const s = Math.min(1, max/Math.max(w,h)); return { w:Math.max(1,Math.round(w*s)), h:Math.max(1,Math.round(h*s)) }; }
function toBlob(c, type="image/jpeg", q=0.9){ return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")), type, q)); }
function loadImg(src){ return new Promise((res,rej)=>{ const i = new Image(); i.decoding = "async"; i.onload = ()=>res(i); i.onerror = ()=>rej(new Error("load")); i.src = src; }); }
async function decodeFile(file){
  const url = URL.createObjectURL(file);
  try{ const img = await loadImg(url); return { img, url }; }
  catch(e){ URL.revokeObjectURL(url); throw e; }
}
function drawScaled(src, w, h){ const c = mkCanvas(w,h); const x = ctx2d(c); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = "high"; x.drawImage(src,0,0,c.width,c.height); return c; }
function drawCover(x, img, dx, dy, dw, dh){
  const iw = img.naturalWidth || img.videoWidth || img.width, ih = img.naturalHeight || img.videoHeight || img.height;
  const s = Math.max(dw/iw, dh/ih); const sw = dw/s, sh = dh/s;
  x.drawImage(img, (iw-sw)/2, (ih-sh)/2, sw, sh, dx, dy, dw, dh);
}

/* analysis on a 512px proxy: sharpness, exposure, colour cast, perceptual hash */
function analyze(img){
  const W0 = img.naturalWidth || img.width, H0 = img.naturalHeight || img.height;
  const { w, h } = fit(W0, H0, 512);
  const c = drawScaled(img, w, h);
  const d = ctx2d(c, true).getImageData(0,0,w,h).data;
  const n = w*h, L = new Float32Array(n), hist = new Uint32Array(256);
  let sum=0, hi=0, lo=0, sr=0, sg=0, sb=0, cnt=0;
  for(let i=0,j=0;i<n;i++,j+=4){
    const r=d[j], g=d[j+1], b=d[j+2]; const l = 0.2126*r + 0.7152*g + 0.0722*b;
    L[i]=l; hist[l|0]++; sum+=l; if(l>=250) hi++; if(l<=5) lo++;
    if(l>30 && l<225){ sr+=r; sg+=g; sb+=b; cnt++; }
  }
  const pct = (p)=>{ const t=n*p; let a=0; for(let v=0;v<256;v++){ a+=hist[v]; if(a>=t) return v; } return 255; };
  // sharpness: Laplacian variance per tile, keep the sharpest tile (subject may sit on a soft background)
  const T=4, s1=new Float64Array(T*T), s2=new Float64Array(T*T), sc=new Uint32Array(T*T);
  for(let y=1;y<h-1;y++){ const ty = Math.min(T-1,(y*T/h)|0);
    for(let x=1;x<w-1;x++){ const i=y*w+x; const lap = L[i-w]+L[i+w]+L[i-1]+L[i+1]-4*L[i]; const t = ty*T + Math.min(T-1,(x*T/w)|0); s1[t]+=lap; s2[t]+=lap*lap; sc[t]++; } }
  let sharp = 0; for(let t=0;t<T*T;t++){ if(sc[t]>50){ const m=s1[t]/sc[t]; sharp = Math.max(sharp, s2[t]/sc[t]-m*m); } }
  // dHash 64-bit
  const hc = drawScaled(c, 9, 8); const hd = ctx2d(hc, true).getImageData(0,0,9,8).data;
  let bits = ""; for(let y=0;y<8;y++) for(let x=0;x<8;x++){ const a=(y*9+x)*4, b=(y*9+x+1)*4; const la = hd[a]*.3+hd[a+1]*.59+hd[a+2]*.11, lb = hd[b]*.3+hd[b+1]*.59+hd[b+2]*.11; bits += la < lb ? "1" : "0"; }
  let hash = ""; for(let i=0;i<64;i+=4) hash += parseInt(bits.slice(i,i+4),2).toString(16);
  return { W0, H0, mean:sum/n, p003:pct(.003), p997:pct(.997), p05:pct(.05), p95:pct(.95), clipHi:hi/n, clipLo:lo/n,
           avg: cnt ? [sr/cnt, sg/cnt, sb/cnt] : [128,128,128], sharp: Math.round(sharp), hash };
}

/* retouch presets: white balance, levels, tone, vibrance, optional skin smoothing */
const PRESETS = {

  vivid:    { wb:.5,  levels:.9, lift:.5, vib:.34, contrast:.22, smooth:0,   warm:0 },
  portrait: { wb:.55, levels:.7, lift:.7, vib:.08, contrast:.05, smooth:.55, warm:.025 },

/* ---------- EXIF (capture time + camera) ---------- */
async function readExif(file){
  try{
    if(!/jpe?g/i.test(file.type) && !/\.jpe?g$/i.test(file.name)) return {};
    const buf = await file.slice(0, 262144).arrayBuffer(); const v = new DataView(buf);
    if(v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return {};
    let o = 2;
    while(o + 10 < v.byteLength){
      const m = v.getUint16(o); if((m & 0xFF00) !== 0xFF00) break; const len = v.getUint16(o+2);
      if(m === 0xFFE1 && v.getUint32(o+4) === 0x45786966) return parseTiff(v, o+10);
      if(m === 0xFFDA) break; o += 2 + len;
    }
  }catch{}
  return {};
}
function parseTiff(v, t){
  try{
    const le = v.getUint16(t) === 0x4949; const u16 = p=>v.getUint16(p,le), u32 = p=>v.getUint32(p,le);
    const str = (off,cnt)=>{ let s=""; for(let i=0;i<cnt && off+i<v.byteLength;i++){ const c=v.getUint8(off+i); if(!c) break; s+=String.fromCharCode(c); } return s.trim(); };
    const ifd = (p)=>{ const out={}; const n=u16(p); for(let i=0;i<n;i++){ const e=p+2+i*12; if(e+12>v.byteLength) break; const tag=u16(e), type=u16(e+2), cnt=u32(e+4);
      if(type===2) out[tag] = str(cnt>4 ? t+u32(e+8) : e+8, cnt); else if(type===4) out[tag]=u32(e+8); else if(type===3) out[tag]=u16(e+8); } return out; };
    const i0 = ifd(t + u32(t+4)); const ex = i0[0x8769] ? ifd(t + i0[0x8769]) : {};
    const dt = ex[0x9003] || i0[0x0132]; let takenAt = null;
    const mm = dt && /^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/.exec(dt);
    if(mm) takenAt = new Date(+mm[1], mm[2]-1, +mm[3], +mm[4], +mm[5], +mm[6]).getTime();
    const make = i0[0x010F] || "", model = i0[0x0110] || "";
    const camera = model ? (model.toLowerCase().startsWith(make.toLowerCase()) || !make ? model : make + " " + model) : (make || null);
    return { takenAt, camera };
  }catch{ return {}; }
}

/* ---------- zip (stored, no compression: JPEGs don’t compress) ---------- */
const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();

async function makeZip(entries){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const now = new Date();
  const tm = (now.getHours()<<11)|(now.getMinutes()<<5)|((now.getSeconds()/2)|0);
  const dt = ((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  const used = new Set();
  for(const e of entries){
    let name = e.name.replace(/[\\/:*?"<>|]+/g,"_"); const dot = name.lastIndexOf(".");
    let k = 2; while(used.has(name.toLowerCase())){ name = dot>0 ? `${e.name.slice(0,dot)}-${k}${e.name.slice(dot)}` : `${e.name}-${k}`; k++; }
    used.add(name.toLowerCase());
    const data = new Uint8Array(await e.blob.arrayBuffer()), crc = crc32(data), nb = enc.encode(name);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,tm,true); h.setUint16(12,dt,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,nb.length,true); h.setUint16(28,0,true);
    parts.push(h, nb, data);

    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,tm,true); c.setUint16(14,dt,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true);

  end.setUint32(0,0x06054b50,true); end.setUint16(4,0,true); end.setUint16(6,0,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true);
  end.setUint32(12,cd,true); end.setUint32(16,off,true); end.setUint16(20,0,true);
  return new Blob([...parts, ...central, end], { type:"application/zip" });
}

const wmCache = new Map();
async function fontsReady(){ try{ await Promise.all([document.fonts.load('800 60px "Archivo"'), document.fonts.load('400 30px "Archivo"')]); }catch{} }
async function watermarkImage(album){
  const b = brandOf(album).wm; if(b.mode === "off") return null;
  const key = album.id + JSON.stringify(b) + (brandOf(album).logoId||"");
  if(wmCache.has(key)) return wmCache.get(key);
  let out = null;
  try{
    if(b.mode === "logo"){
      const id = brandOf(album).logoId; if(id){ const img = await loadImg(blobUrl(id)); out = { img, url: blobUrl(id), aspect: img.naturalWidth/img.naturalHeight }; }
    }else if(b.text.trim()){
      await fontsReady();

      const tw = Math.ceil(m.measureText(txt).width) + 24; const c = mkCanvas(tw, fs*1.35); const x = c.getContext("2d");
      x.font = m.font; x.textBaseline = "middle"; x.shadowColor = "rgba(0,0,0,.45)"; x.shadowBlur = 10; x.fillStyle = "#fff"; x.fillText(txt, 12, c.height/2);

}
async function drawWatermark(x, bx, by, bw, bh, album){
  const b = brandOf(album).wm; const w = await watermarkImage(album); if(!w) return;
  const ww = bw * clamp(b.size,5,80)/100, wh = ww / w.aspect, m = bw*0.03;
  let px = bx + bw - ww - m, py = by + bh - wh - m;
  if(b.pos==="tl"){ px=bx+m; py=by+m; } else if(b.pos==="tr"){ py=by+m; } else if(b.pos==="bl"){ px=bx+m; } else if(b.pos==="c"){ px=bx+(bw-ww)/2; py=by+(bh-wh)/2; }
  x.save(); x.globalAlpha = clamp(b.opacity,.1,1); x.drawImage(w.img, px, py, ww, wh); x.restore();
}

  const w = await watermarkImage(album); if(!w) return "";
  const b = brandOf(album).wm;
  return `<img class="wm ${esc(b.pos)}" alt="" src="${esc(w.url)}" style="width:${clamp(b.size,5,80)}%;opacity:${clamp(b.opacity,.1,1)}">`;

/* ---------- QR ---------- */
function qrMatrix(text){
  if(!text || typeof window.qrcode !== "function") return null;
  try{ const q = window.qrcode(0, "M"); q.addData(text); q.make(); const n = q.getModuleCount(); return { n, dark:(r,c)=>q.isDark(r,c) }; }catch{ return null; }
}
function qrSVG(text){
  const m = qrMatrix(text); if(!m) return "";
  const q = 4, N = m.n + q*2; let d = "";
  for(let r=0;r<m.n;r++) for(let c=0;c<m.n;c++) if(m.dark(r,c)) d += `M${c+q} ${r+q}h1v1h-1z`;
  return `<svg viewBox="0 0 ${N} ${N}" role="img" aria-label="QR code for the gallery link" shape-rendering="crispEdges"><rect width="${N}" height="${N}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}
function drawQR(x, text, px, py, size){
  const m = qrMatrix(text); if(!m) return false;
  const q = 3, N = m.n + q*2, s = size/N;
  x.fillStyle = "#fff"; x.fillRect(px,py,size,size); x.fillStyle = "#111";
  for(let r=0;r<m.n;r++) for(let c=0;c<m.n;c++) if(m.dark(r,c)) x.fillRect(Math.floor(px+(c+q)*s), Math.floor(py+(r+q)*s), Math.ceil(s), Math.ceil(s));
  return true;
}
/* ============================================================
   Pipeline: ingest, AI tagging, retouch again, replace, tracking, posters
   ============================================================ */
const Store = {
  get(k, d){ try{ const v = localStorage.getItem("lensdrop." + k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("lensdrop." + k, JSON.stringify(v)); }catch{} }
};

async function uploadAll(items){
  const rs = await Promise.allSettled(items.map(([b,t])=>uploadBlob(b,t)));
  const bad = rs.find(r=>r.status==="rejected");
  if(bad){ for(const r of rs) if(r.status==="fulfilled") deleteAsset(r.value.id); throw bad.reason; }
  return rs.map(r=>r.value);
}

const Ingest = {
  jobs: [], active: 0, CONC: 2, recent: [],
  add(files, albumId, category, mode){
    const list = [...files];
    for(const file of list){
      const kind = /^video\//.test(file.type) ? "video" : "photo";
      const job = { key: rid(), file, name: file.name, kind, albumId, category: category || null, mode: mode || "new", stage: "Waiting", err: false, ms: null, thumb: null, status: null };
      if(mode === "replace"){
        const matches = photoList().filter(x => baseName(x.name).toLowerCase() === baseName(file.name).toLowerCase() && x.kind !== "video");
        if(matches.length !== 1){ job.stage = matches.length ? "Ambiguous filename: select a unique photo ID before returning this edit" : "No frame in this album has this file name"; job.err = true; job.done = true; }
        else job.target = matches[0].id;
      }
      this.jobs.push(job);
    }
    // Only successful, completed history is bounded. Pending/running/error records survive.
    let keptCompleted = 0;
    this.jobs = this.jobs.slice().reverse().filter(j => {
      if(!j.done || j.running || j.err) return true;
      if(keptCompleted++ < 400) return true;
      if(j.thumb) URL.revokeObjectURL(j.thumb);
      return false;
    }).reverse();
    this.render(); this.pump();
  },
  pump(){
    while(this.active < this.CONC){
      const job = this.jobs.find(j => !j.done && !j.running); if(!job) break;
      job.running = true; this.active++;
      const run = job.mode === "replace" ? replaceJob(job) : processJob(job);
      run.catch(e=>{ job.err = true; job.stage = (e && e.msg) || uploadMessage(e); })
         .finally(()=>{ job.done = true; job.running = false; this.active--; this.render(); this.pump(); });
    }
  },
  stage(job, s){ job.stage = s; this.render(); },
  render(){ if(Console.mountedTab === "ingest") Console.tabs.ingest.renderQueue(); },
};

function findDup(albumId, hash, takenAt){
  const pool = [];
  if(S.photosAlbum === albumId) for(const [id,p] of S.photos) if(p.cull && p.cull.hash) pool.push({ id, hash: p.cull.hash, takenAt: p.takenAt });
  for(const r of Ingest.recent) if(r.albumId === albumId && !S.photos.has(r.id)) pool.push(r);
  // a failed upload leaves a recent entry that never became a frame; that’s harmless for matching
  let best = null, bd = 99;
  for(const c of pool.slice(-500)){
    const d = hamming(hash, c.hash);
    if(d < bd && (!takenAt || !c.takenAt || Math.abs(takenAt - c.takenAt) < 90000)){ bd = d; best = c; }
  }
  return bd <= 5 ? best.id : null;
}

async function processJob(job){
  const t0 = performance.now();
  const album = S.albums.get(job.albumId); if(!album) throw { msg: "This album no longer exists." };
  const c = cfg(album);
  if(job.kind === "video") return processVideo(job, c, t0);
  Ingest.stage(job, "Reading");
  const exif = await readExif(job.file);
  let dec; try{ dec = await decodeFile(job.file); }catch{ throw { msg: "This file can’t be opened in this browser. Export it as JPEG and add it again." }; }
  try{
    Ingest.stage(job, "Culling");
    await sleep(0);
    const a = analyze(dec.img); const ex = exposureFlags(a);
    const blurry = c.cullOn && a.sharp < c.blur, dark = c.cullOn && ex.dark, bright = c.cullOn && ex.bright;
    const takenAt = exif.takenAt || job.file.lastModified || null;
    const dupOf = c.cullOn ? findDup(job.albumId, a.hash, exif.takenAt || null) : null;
    const flagged = blurry || dark || bright || !!dupOf;
    const pid = rid();
    Ingest.recent.push({ albumId: job.albumId, id: pid, hash: a.hash, takenAt: exif.takenAt || null });
    if(Ingest.recent.length > 600) Ingest.recent.splice(0, 100);
    const retouch = PRESETS[c.retouch] ? c.retouch : null;
    Ingest.stage(job, retouch ? "Retouching" : "Preparing");
    await sleep(0);
    let sourceBlob = null;
    if(retouch) sourceBlob = await toBlob(renderDelivery(dec.img, a, "off", c.maxEdge), "image/jpeg", .9);
    const del = renderDelivery(dec.img, a, retouch || "off", c.maxEdge);
    const delBlob = await toBlob(del, "image/jpeg", .9);
    const tf = fit(del.width, del.height, 640); const thumbBlob = await toBlob(drawScaled(del, tf.w, tf.h), "image/jpeg", .82);
    let aiBlob = null;
    if(c.aiTag && S.sample && S.aiLimits && !AI.disabled){ const af = fit(del.width, del.height, 1280); aiBlob = await toBlob(drawScaled(del, af.w, af.h), "image/jpeg", .85); }
    job.thumb = URL.createObjectURL(thumbBlob);
    Ingest.stage(job, "Uploading");
    const items = [[delBlob,"image/jpeg"],[thumbBlob,"image/jpeg"]]; if(sourceBlob) items.push([sourceBlob,"image/jpeg"]);
    const [up, th, src] = await uploadAll(items);
    const status = (flagged && c.hold) ? "review" : (c.publish === "live" ? "live" : "review");
    const ingestMs = Math.round(performance.now() - t0);
    const doc = {
      kind: "photo", name: job.file.name, assetId: up.id, thumbId: th.id, sourceId: src ? src.id : null,
      w: del.width, h: del.height, bytes: up.sizeBytes || delBlob.size, origBytes: job.file.size,
      takenAt, uploadedAt: Date.now(), uploader: S.me.id || null, category: job.category, status, pick: false,
      retouch, camera: exif.camera || null, ingestMs,
      cull: { checked: c.cullOn, sharp: a.sharp, mean: Math.round(a.mean), hash: a.hash, blurry, dark, bright, dup: !!dupOf, dupOf: dupOf || null },
      ai: null,
    };
    try{ await photoRef(job.albumId, pid).set(doc); }
    catch(e){ for(const r of [up,th,src]) if(r) deleteAsset(r.id); throw { msg: (e && e.code === "quota_exceeded") ? "This album has reached its photo limit. Delete frames you don’t need." : "Saving the frame didn’t work. Add the file again." }; }
    job.pid = pid; job.ms = ingestMs; job.status = status;
    const fl = flagsOf(doc);
    Ingest.stage(job, status === "live" ? (fl.length ? "Live, flagged: " + fl.join(", ").toLowerCase() : "Live in the gallery") : (fl.length && c.hold ? "Held for review: " + fl.join(", ").toLowerCase() : "Waiting for review"));
    if(aiBlob) AI.enqueue([{ albumId: job.albumId, pid, blob: aiBlob }]);
  }finally{ URL.revokeObjectURL(dec.url); }
}

async function processVideo(job, c, t0){
  if(!/^video\/(mp4|webm)$/.test(job.file.type)) throw { msg: "Convert this clip to MP4 or WebM to add it." };
  if(job.file.size > 20*1024*1024) throw { msg: "Clips can be up to 20 MB here. Trim or compress it, then add it again." };
  Ingest.stage(job, "Reading");
  const url = URL.createObjectURL(job.file);
  try{
    const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    await new Promise((res, rej)=>{ v.onloadeddata = res; v.onerror = ()=>rej({ msg: "This clip can’t be played in this browser." }); setTimeout(()=>rej({ msg: "This clip took too long to open." }), 15000); });
    await new Promise(res=>{ v.onseeked = res; try{ v.currentTime = Math.min(.6, (v.duration || 1)/3); }catch{ res(); } setTimeout(res, 3000); });
    const vw = v.videoWidth || 1280, vh = v.videoHeight || 720; const tf = fit(vw, vh, 640);
    const pc = mkCanvas(tf.w, tf.h); pc.getContext("2d").drawImage(v, 0, 0, tf.w, tf.h);
    const thumbBlob = await toBlob(pc, "image/jpeg", .82); job.thumb = URL.createObjectURL(thumbBlob);
    Ingest.stage(job, "Uploading");
    const [up, th] = await uploadAll([[job.file, job.file.type], [thumbBlob, "image/jpeg"]]);
    const pid = rid(); const status = c.publish === "live" ? "live" : "review"; const ingestMs = Math.round(performance.now() - t0);
    await photoRef(job.albumId, pid).set({
      kind: "video", name: job.file.name, assetId: up.id, thumbId: th.id, sourceId: null, w: vw, h: vh, duration: Math.round((v.duration||0)*10)/10,
      bytes: up.sizeBytes || job.file.size, origBytes: job.file.size, takenAt: job.file.lastModified || null, uploadedAt: Date.now(),
      uploader: S.me.id || null, category: job.category, status, pick: false, retouch: null, camera: null, ingestMs, cull: null, ai: null,
    });
    job.pid = pid; job.ms = ingestMs; job.status = status;

  }finally{ URL.revokeObjectURL(url); }
}

/* a retoucher returns an edited file: it replaces the frame with the same file name */
async function replaceJob(job){
  const t0 = performance.now();
  const p = S.photos.get(job.target); if(!p) throw { msg: "That frame was deleted." };
  const album = S.albums.get(job.albumId); const c = cfg(album);
  Ingest.stage(job, "Reading");
  let dec; try{ dec = await decodeFile(job.file); }catch{ throw { msg: "This file can’t be opened in this browser. Export it as JPEG." }; }
  try{
    const a = analyze(dec.img);
    const del = renderDelivery(dec.img, a, "off", c.maxEdge);
    const delBlob = await toBlob(del, "image/jpeg", .92);
    const tf = fit(del.width, del.height, 640); const thumbBlob = await toBlob(drawScaled(del, tf.w, tf.h), "image/jpeg", .82);
    job.thumb = URL.createObjectURL(thumbBlob);
    Ingest.stage(job, "Uploading");
    const [up, th] = await uploadAll([[delBlob,"image/jpeg"],[thumbBlob,"image/jpeg"]]);
    const keepSource = p.sourceId || p.assetId;
    const ex = exposureFlags(a);
    const nextStatus = (p.status === "editing" || p.status === "review") ? (c.publish === "live" ? "live" : "review") : p.status;
    await photoRef(job.albumId, job.target).update({
      assetId: up.id, thumbId: th.id, sourceId: keepSource, w: del.width, h: del.height, bytes: up.sizeBytes || delBlob.size,
      retouch: "manual", editedAt: Date.now(), editor: S.me.id || null, status: nextStatus,
      cull: { sharp: a.sharp, mean: Math.round(a.mean), blurry: false, dark: ex.dark && c.cullOn, bright: ex.bright && c.cullOn, dup: false, dupOf: null },
    });
    if(p.assetId && p.assetId !== keepSource) deleteAsset(p.assetId);
    if(p.thumbId) deleteAsset(p.thumbId);
    job.pid = job.target; job.ms = Math.round(performance.now() - t0); job.status = nextStatus;
    Ingest.stage(job, nextStatus === "live" ? "Edited version is live" : "Edited version saved");
  }finally{ URL.revokeObjectURL(dec.url); }
}

/* run a different retouch preset from the untouched source */
async function retouchAgain(albumId, pid, preset){
  const p = S.photos.get(pid); if(!p || p.kind === "video") return;
  const album = S.albums.get(albumId); const c = cfg(album);
  const base = p.sourceId || p.assetId;
  const raw = await fetchBlob(base); const u = URL.createObjectURL(raw);
  try{
    const img = await loadImg(u); const a = analyze(img);
    let newAsset, del;
    if(!PRESETS[preset]){ del = drawScaled(img, img.naturalWidth, img.naturalHeight); newAsset = { id: base }; }
    else{ del = renderDelivery(img, a, preset, c.maxEdge); newAsset = await uploadBlob(await toBlob(del, "image/jpeg", .9), "image/jpeg"); }
    const tf = fit(del.width, del.height, 640); const th = await uploadBlob(await toBlob(drawScaled(del, tf.w, tf.h), "image/jpeg", .82), "image/jpeg");
    await photoRef(albumId, pid).update({ assetId: newAsset.id, thumbId: th.id, sourceId: base, retouch: PRESETS[preset] ? preset : null, w: del.width, h: del.height });
    if(p.assetId && p.assetId !== base && p.assetId !== newAsset.id) deleteAsset(p.assetId);
    if(p.thumbId) deleteAsset(p.thumbId);
  }finally{ URL.revokeObjectURL(u); }
}

async function deletePhoto(albumId, pid){
  const p = S.photos.get(pid); if(!p) return;
  await photoRef(albumId, pid).delete();
  for(const id of [p.assetId, p.thumbId, p.sourceId]) if(id) await deleteAsset(id);
}

/* ---------- Claude tagging: captions, search words, numbers, outfits, quality issues ---------- */
const AI_ISSUES = ["eyes closed","motion blur","out of focus","cut-off subject","obstructed","too dark","too bright"];
function aiPrompt(n){
  return `You are tagging ${n} event photo${n>1?"s":""} for a searchable live gallery. The images are attached in order.
For each image return one object with these fields:
"caption": one short sentence describing the scene and action. Never name or identify any person.
"tags": 5 to 12 lowercase search words for the scene, activity, objects, setting and mood.
"numbers": every clearly readable bib, race, jersey or table number as strings, or [].
"outfits": up to 6 short descriptions of visible clothing, like "red dress" or "navy suit, white shirt", or [].
"issues": those of ${JSON.stringify(AI_ISSUES)} that clearly apply to the main subject, or [].
Return only a JSON array of ${n} objects in image order.`;
}
function normAI(r){
  const arr = (v, max, len) => (Array.isArray(v) ? v : []).map(x=>String(x).trim()).filter(Boolean).slice(0, max).map(s=>s.slice(0, len));
  return {
    caption: String((r && r.caption) || "").slice(0, 220),
    tags: arr(r && r.tags, 15, 40).map(s=>s.toLowerCase()),
    numbers: arr(r && r.numbers, 12, 12).map(s=>s.replace(/[^0-9A-Za-z-]/g,"")).filter(Boolean),
    outfits: arr(r && r.outfits, 8, 60).map(s=>s.toLowerCase()),
    issues: arr(r && r.issues, 7, 30).map(s=>s.toLowerCase()).filter(s=>AI_ISSUES.includes(s)),
    at: Date.now(),
  };
}
const AI = {
  q: [], busy: false, paused: false, disabled: false, note: "", done: 0, failed: 0,
  enqueue(jobs){
    if(this.disabled || !S.sample || !S.aiLimits){ toast("Claude tagging isn’t available in this view."); return; }
    this.q.push(...jobs); this.render(); this.pump();
  },
  resume(){ this.paused = false; this.note = ""; this.render(); this.pump(); },
  async pump(){
    if(this.busy || this.paused || !this.q.length) return;
    this.busy = true; this.render();
    try{
      while(this.q.length && !this.paused && !this.disabled){
        const max = Math.max(1, Math.min((S.aiLimits && S.aiLimits.maxCount) || 1, 4));
        await this.batch(this.q.splice(0, max));
        this.render();
      }
    }finally{ this.busy = false; this.render(); }
  },
  async blobFor(job){
    if(job.blob) return job.blob;
    const p = S.photos.get(job.pid); if(!p) throw new Error("gone");
    const raw = await fetchBlob(p.assetId); const u = URL.createObjectURL(raw);
    try{ const img = await loadImg(u); const f = fit(img.naturalWidth, img.naturalHeight, 1280); return await toBlob(drawScaled(img, f.w, f.h), "image/jpeg", .85); }
    finally{ URL.revokeObjectURL(u); }
  },
  async batch(jobs){
    const ok = [], blobs = [];
    for(const j of jobs){ try{ blobs.push(await this.blobFor(j)); ok.push(j); }catch{ this.failed++; } }
    if(!ok.length) return;
    try{
      const opts = { images: blobs }; if(S.aiTier) opts.modelTier = S.aiTier;
      const out = await S.sample.json(aiPrompt(ok.length), opts);
      const arr = Array.isArray(out) ? out : (out && Array.isArray(out.photos) ? out.photos : [out]);
      for(let i=0;i<ok.length;i++){
        const r = arr[i]; if(!r || typeof r !== "object"){ this.failed++; continue; }
        try{ await photoRef(ok[i].albumId, ok[i].pid).update({ ai: normAI(r) }); this.done++; }catch{ this.failed++; }
      }
    }catch(e){
      const c = e && e.code;
      if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","images_unavailable"].includes(c)){
        this.disabled = true; this.q = []; this.note = c === "not_granted" ? "Claude tagging is off because permission wasn’t given." : "Claude tagging isn’t available in this view.";
      }else if(c === "rate_limited" || c === "session_expired" || c === "upstream_error"){
        this.paused = true; this.q.unshift(...ok);
        this.note = c === "rate_limited" ? "Claude’s usage limit was reached. Resume tagging later." : c === "session_expired" ? "Your session expired. Reload, then resume tagging." : "Tagging stopped after a connection problem.";
      }else{ this.failed += ok.length; }
    }
  },
  render(){ if(Console.mountedTab === "ingest") Console.tabs.ingest.renderAI(); }
};

function hourKey(ts){ const d = new Date(ts || Date.now()); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}`; }
function sessionId(){ let v = Store.get("sid", null); if(!v || !/^[a-z0-9]{8,40}$/.test(v)){ v = (rid() + rid()).slice(0, 24); Store.set("sid", v); } return v; }
const Track = {
  ref: null, data: null, albumId: null, dirty: false, timer: null, busy: false, off: false,
  async start(albumId){
    if(this.albumId === albumId) return;
    const prev = this.flush(); this.albumId = albumId; this.data = null; this.ref = null; await prev;
    if(S.me.canEdit || this.off || !S.db) return;
    const ref = S.db.doc(`stats/${albumId}/sessions/${sessionId()}`);
    let data;
    try{ const s = await ref.get(); data = s.exists ? JSON.parse(JSON.stringify(s.data())) : { opens: 0, pv: {}, dl: {}, posters: 0, hours: {} }; }
    catch{ this.off = true; return; }
    if(this.albumId !== albumId) return;
    this.ref = ref; this.data = data;
    this.bump("open");
  },
  bump(kind, pid){
    if(!this.data || this.off) return;
    const a = this.data;
    if(kind === "open"){ a.opens = (a.opens||0)+1; a.hours = a.hours || {}; const h = hourKey(); a.hours[h] = (a.hours[h]||0)+1; }
    else if(kind === "view"){ a.pv = a.pv || {}; a.pv[pid] = (a.pv[pid]||0)+1; }
    else if(kind === "dl"){ a.dl = a.dl || {}; a.dl[pid] = (a.dl[pid]||0)+1; }
    else if(kind === "poster"){ a.posters = (a.posters||0)+1; }
    this.dirty = true; this.schedule();
  },
  schedule(){ if(this.timer) return; this.timer = setTimeout(()=>{ this.timer = null; this.flush(); }, 4000); },
  async flush(){
    if(!this.dirty || !this.ref || this.off) return;
    if(this.busy){ this.schedule(); return; }
    this.busy = true; this.dirty = false;
    try{ await this.ref.set(this.data); }
    catch(e){ if(e && (e.code === "invalid_argument" || e.code === "revoked")) this.off = true; else this.dirty = true; }
    finally{ this.busy = false; }
  }
};

/* ---------- posters, carousel slides, table cards ---------- */
function wrapLines(x, text, maxW, maxLines){
  const words = String(text||"").split(/\s+/).filter(Boolean); const lines = []; let line = "";
  for(const w of words){
    const t = line ? line + " " + w : w;
    if(x.measureText(t).width <= maxW || !line){ line = t; }
    else{ lines.push(line); line = w; if(lines.length === maxLines){ line = ""; break; } }
  }
  if(line && lines.length < maxLines) lines.push(line);
  if(lines.length === maxLines && words.join(" ") !== lines.join(" ")){
    let last = lines[maxLines-1]; while(last && x.measureText(last + "…").width > maxW) last = last.slice(0,-1); lines[maxLines-1] = last.trimEnd() + "…";
  }
  return lines;
}
function setWide(x){ try{ if("fontStretch" in x) x.fontStretch = "expanded"; }catch{} }
function setNormal(x){ try{ if("fontStretch" in x) x.fontStretch = "normal"; }catch{} }
async function renderPoster(album, p, fmt, idx, total){
  await fontsReady(); try{ await document.fonts.load('800 expanded 60px "Archivo"'); }catch{}
  const B = brandOf(album), bg = B.color, fg = contrastInk(bg);

  x.fillStyle = bg; x.fillRect(0,0,W,H);
  let logo = null; if(B.logoId){ try{ logo = await loadImg(blobUrl(B.logoId)); }catch{} }
  let img = null; if(p && p.kind !== "video"){ try{ img = await loadImg(blobUrl(p.assetId)); }catch{} } else if(p){ try{ img = await loadImg(blobUrl(p.thumbId)); }catch{} }
  const link = galleryLink(album);
  const meta = [fmtDate(album.date), album.venue].filter(Boolean).join(", ");
  const drawLogo = (lx, ly, maxH, maxW)=>{ if(!logo) return 0; const s = Math.min(maxH/logo.naturalHeight, maxW/logo.naturalWidth); const w = logo.naturalWidth*s, h = logo.naturalHeight*s; x.drawImage(logo, lx, ly + (maxH-h)/2, w, h); return w; };
  x.fillStyle = fg; x.textBaseline = "alphabetic";
  if(fmt === "slide"){
    const band = 150;
    if(img){ drawCover(x, img, 0, 0, W, H-band); await drawWatermark(x, 0, 0, W, H-band, album); }
    x.fillStyle = bg; x.fillRect(0, H-band, W, band); x.fillStyle = fg;
    const lw = drawLogo(56, H-band+35, 80, 220);
    setWide(x); x.font = "800 40px Archivo, Arial, sans-serif";
    const tl = wrapLines(x, album.title, W - 112 - (lw ? lw+28 : 0) - 120, 1);
    x.fillText(tl[0] || "", 56 + (lw ? lw+28 : 0), H - band/2 + 14);
    setNormal(x); x.font = "600 30px Archivo, Arial, sans-serif"; x.textAlign = "right"; x.fillText(`${idx}/${total}`, W-56, H - band/2 + 12); x.textAlign = "left";
  }else if(fmt === "card"){
    const m = 90; let y = 170;
    const lw = logo ? drawLogo(m, 70, 110, 420) : 0;
    if(lw) y = 270;
    setWide(x); x.font = "850 86px Archivo, Arial, sans-serif";
    for(const l of wrapLines(x, album.title, W-2*m, 3)){ x.fillText(l, m, y); y += 96; }
    setNormal(x); x.font = "400 38px Archivo, Arial, sans-serif"; if(meta){ x.globalAlpha=.85; x.fillText(meta, m, y+6); x.globalAlpha=1; y += 70; }
    const qs = 640, qx = (W-qs)/2, qy = Math.max(y + 40, 760);
    if(link && drawQR(x, link, qx, qy, qs)){
      x.fillStyle = fg; x.font = "700 46px Archivo, Arial, sans-serif"; x.textAlign = "center";
      x.fillText("Scan to see the photos live", W/2, qy + qs + 86); x.textAlign = "left";
    }else{ x.font = "600 40px Archivo, Arial, sans-serif"; x.fillText("Ask the photographer for the gallery link.", m, qy + 60); }
  }else{
    const m = 64, ph = fmt === "story" ? 1240 : 870;
    if(img){ drawCover(x, img, m, m, W-2*m, ph); if(p.kind !== "video") await drawWatermark(x, m, m, W-2*m, ph, album); }
    const qs = fmt === "story" ? 240 : 200, hasQR = !!(link && qrMatrix(link));
    const textW = W - 2*m - (hasQR ? qs + 36 : 0);
    let y = m + ph + (fmt === "story" ? 110 : 92);
    setWide(x); x.font = `850 ${fmt === "story" ? 64 : 56}px Archivo, Arial, sans-serif`; x.fillStyle = fg;
    for(const l of wrapLines(x, album.title, textW, 2)){ x.fillText(l, m, y); y += fmt === "story" ? 74 : 64; }
    setNormal(x); x.font = "400 30px Archivo, Arial, sans-serif";
    if(meta){ x.globalAlpha = .85; x.fillText(meta, m, y + 4); x.globalAlpha = 1; }
    if(logo) drawLogo(m, H - m - 90, 90, 360);
    if(hasQR){ const qy = fmt === "story" ? H - m - qs - 40 : m + ph + 40; drawQR(x, link, W - m - qs, qy, qs); x.font = "500 22px Archivo, Arial, sans-serif"; x.fillStyle = fg; x.textAlign = "center"; x.fillText("All photos", W - m - qs/2, qy + qs + 32); x.textAlign = "left"; }
  }
  return toBlob(c, fmt === "card" ? "image/png" : "image/jpeg", .92);
}

function setPath(obj, path, val){ const ks = path.split("."); let o = obj; for(let i=0;i<ks.length-1;i++) o = o[ks[i]] = o[ks[i]] || {}; o[ks[ks.length-1]] = val; return obj; }

function syncList(container, items, make, update){
  const existing = new Map(); for(const el of [...container.children]) if(el.dataset && el.dataset.id) existing.set(el.dataset.id, el); else el.remove();
  let prev = null;
  for(const it of items){
    let el = existing.get(it.id);
    if(el){ existing.delete(it.id); update(el, it); } else { el = make(it); }
    const want = prev ? prev.nextSibling : container.firstChild;
    if(want !== el) container.insertBefore(el, want);
    prev = el;
  }
  for(const el of existing.values()) el.remove();
}

    $("#sChips").onclick = (e)=>{ const b = e.target.closest("button[data-v]"); if(!b) return; Console.filter.status = b.dataset.v; this.update(Console.album()); };
    $("#sCat").onchange = (e)=>{ Console.filter.cat = e.target.value; this.update(Console.album()); };
    $("#sBy").onchange = (e)=>{ Console.filter.by = e.target.value; this.update(Console.album()); };
    $("#sSort").onchange = (e)=>{ Console.filter.sort = e.target.value; this.update(Console.album()); };
    $("#sAll").onclick = ()=>{ const vis = this.visible(); const all = vis.every(p=>Console.sel.has(p.id)); vis.forEach(p=>all ? Console.sel.delete(p.id) : Console.sel.add(p.id)); this.update(Console.album()); };
    const sheet = $("#sheet");
    sheet.onclick = (e)=>{
      const f = e.target.closest(".f"); if(!f) return; const id = f.dataset.id;
      if(e.target.classList.contains("f-sel")){ this.toggle(id, e.shiftKey); return; }
      if(Console.sel.size && (e.metaKey || e.ctrlKey || e.shiftKey)){ this.toggle(id, e.shiftKey); return; }
      Console.openDrawer(id);
    };
    sheet.onkeydown = (e)=>{ const f = e.target.closest(".f"); if(!f || e.target.classList.contains("f-sel")) return; if(e.key === "Enter"){ e.preventDefault(); Console.openDrawer(f.dataset.id); } else if(e.key === " "){ e.preventDefault(); this.toggle(f.dataset.id, e.shiftKey); } };
    this.renderFilters(); this.update(album);
  },
  toggle(id, range){
    const vis = this.visible();
    if(range && Console.lastSel){ const a = vis.findIndex(p=>p.id===Console.lastSel), b = vis.findIndex(p=>p.id===id); if(a>=0 && b>=0){ const [lo,hi] = a<b?[a,b]:[b,a]; for(let i=lo;i<=hi;i++) Console.sel.add(vis[i].id); } }
    else if(Console.sel.has(id)) Console.sel.delete(id); else Console.sel.add(id);
    Console.lastSel = id; this.update(Console.album());
  },
  visible(){
    const f = Console.filter; let ps = photoList();
    ps = ps.filter(p=>{
      if(f.status === "flagged") { if(!flagsOf(p).length) return false; }
      else if(f.status === "picks") { if(!p.pick) return false; }
      else if(f.status !== "all" && p.status !== f.status) return false;
      if(f.cat === "none" ? !!p.category : (f.cat && p.category !== f.cat)) return false;
      if(f.by && p.uploader !== f.by) return false;
      return true;
    });
    if(f.sort === "new") ps.reverse();
    return ps;
  },
  renderFilters(){
    const album = Console.album(); if(!album || !$("#sCat")) return; const ps = photoList();
    const cats = catsOf(album); const by = [...new Set(ps.map(p=>p.uploader).filter(Boolean))];
    $("#sCat").innerHTML = `<option value="">All categories</option>${cats.map(k=>`<option value="${esc(k.id)}">${esc(k.name)}</option>`).join("")}<option value="none">No category</option>`; $("#sCat").value = Console.filter.cat;
    $("#sBy").innerHTML = `<option value="">Every photographer</option>${by.map(id=>`<option value="${esc(id)}">${esc(Names.get(id))}</option>`).join("")}`; $("#sBy").value = by.includes(Console.filter.by) ? Console.filter.by : "";
    this.filterSig = cats.map(c=>c.id+c.name).join() + by.join() + "|" + [...Names.map.entries()].join();
  },
  update(album){
    if(!$("#sheet")) return;
    const ps = photoList(); for(const id of [...Console.sel]) if(!S.photos.has(id)) Console.sel.delete(id);
    const cats = catsOf(album); const by = [...new Set(ps.map(p=>p.uploader).filter(Boolean))];
    if(this.filterSig !== cats.map(c=>c.id+c.name).join() + by.join() + "|" + [...Names.map.entries()].join()) this.renderFilters();
    const n = (fn)=>ps.filter(fn).length;
    const chips = [["all","All",ps.length],["live","Live",n(p=>p.status==="live")],["review","Review",n(p=>p.status==="review")],["editing","Editing",n(p=>p.status==="editing")],["hidden","Hidden",n(p=>p.status==="hidden")],["flagged","Flagged",n(p=>flagsOf(p).length>0)],["picks","Picks",n(p=>p.pick)]];
    $("#sChips").innerHTML = chips.map(([v,l,c])=>`<button class="chip" data-v="${v}" aria-pressed="${Console.filter.status===v}">${l}<span class="c">${c}</span></button>`).join("");
    const vis = this.visible(); const sheet = $("#sheet");
    sheet.classList.toggle("selecting", Console.sel.size > 0);
    if(!vis.length){
      sheet.innerHTML = `<div class="sheet-empty">${!S.photosConfirmed ? (S.photosSlow ? "Frames can’t be loaded yet. They’ll appear when the connection recovers." : "Loading frames…") : ps.length ? "No frames match these filters." : "No frames yet. Upload photos and they land here as they finish."}</div>`;
    }else{
      const empty = $(".sheet-empty", sheet); if(empty) empty.remove();
      syncList(sheet, vis, (p)=>this.makeFrame(p), (el,p)=>this.fillFrame(el,p));
    }
    this.renderBulk(album);
  },
  makeFrame(p){
    const el = document.createElement("div"); el.className = "f"; el.dataset.id = p.id; el.tabIndex = 0;
    el.innerHTML = `<div class="f-img"><img alt="" loading="lazy"><svg class="mk" viewBox="0 0 100 66" preserveAspectRatio="none" aria-hidden="true"><path class="mx" d="${MARK_X}"/><path class="mo" d="${MARK_O}"/></svg></div><span class="f-no"></span><span class="f-st"></span><input type="checkbox" class="f-sel"><span class="f-flag" hidden></span>`;
    this.fillFrame(el, p); return el;
  },
  fillFrame(el, p){
    const img = $("img", el); const src = blobUrl(p.thumbId); if(img.getAttribute("src") !== src) img.src = src;
    $(".f-no", el).textContent = String(p.frame).padStart(3, "0");
    const st = $(".f-st", el); st.className = "f-st st-" + p.status; st.textContent = STATUS[p.status] || p.status;
    const fl = flagsOf(p); const ff = $(".f-flag", el); ff.hidden = !fl.length; ff.textContent = fl[0] ? (fl.length > 1 ? `${fl[0]} +${fl.length-1}` : fl[0]) : "";
    $(".mx", el).style.display = fl.length ? "" : "none"; $(".mo", el).style.display = p.pick ? "" : "none";
    const cb = $(".f-sel", el); cb.checked = Console.sel.has(p.id); cb.setAttribute("aria-label", "Select frame " + p.frame);
    el.classList.toggle("sel", cb.checked);
    el.setAttribute("aria-label", `Frame ${p.frame}, ${STATUS[p.status]}${fl.length ? ", flagged " + fl.join(", ") : ""}`);
    let v = $(".f-vid", el); if(p.kind === "video" && !v){ v = document.createElement("span"); v.className = "f-vid"; v.textContent = "Clip"; $(".f-img", el).appendChild(v); }
  },
  renderBulk(album){
    const bar = $("#bulk"); const n = Console.sel.size; bar.hidden = !n; if(!n) return;
    const sig = n + "|" + catsOf(album).map(c=>c.id).join();
    if(bar.dataset.sig === sig) return; bar.dataset.sig = sig;
    bar.innerHTML = `<span><b>${n}</b> selected</span>
      <button class="btn sm" data-a="live">Publish</button><button class="btn sm" data-a="review">Hold</button><button class="btn sm" data-a="editing">Send to editing</button><button class="btn sm" data-a="hidden">Hide</button>
      <button class="btn sm" data-a="pick">Pick</button><button class="btn sm" data-a="unpick">Unpick</button>
      ${catsOf(album).length ? `<select data-a="cat" aria-label="Move to category"><option value="">Move to category…</option>${catsOf(album).map(k=>`<option value="${esc(k.id)}">${esc(k.name)}</option>`).join("")}</select>` : ""}
      <select data-a="retouch" aria-label="Retouch again"><option value="">Retouch again…</option>${["off","natural","vivid","portrait"].map(k=>`<option value="${k}">${PRESET_NAMES[k]}</option>`).join("")}</select>
      <button class="btn sm" data-a="tag">Describe with Claude</button><button class="btn sm" data-a="zip">Download</button><button class="btn sm" data-a="delete">Delete</button>
      <span class="spacer"></span><button class="btn sm" data-a="clear">Clear</button>`;
    bar.onclick = (e)=>{ const b = e.target.closest("button[data-a]"); if(b) this.bulk(b.dataset.a, null, b); };
    bar.onchange = (e)=>{ const s = e.target.closest("select[data-a]"); if(s && s.value){ this.bulk(s.dataset.a, s.value, s); s.value = ""; } };
  },
  async bulk(action, value, ctrl){
    const A = S.current; const ids = [...Console.sel].filter(id=>S.photos.has(id)); if(!ids.length) return;
    const each = async (fn)=>{ let ok = 0; for(const id of ids){ try{ await fn(id); ok++; }catch{} } return ok; };
    if(action === "clear"){ Console.sel.clear(); this.update(Console.album()); return; }
    if(["live","review","editing","hidden"].includes(action)){ const n = await each(id=>photoRef(A,id).update({ status: action, ...(action==="editing"?{ editor: S.me.id || null }:{}) })); toast(`${plural(n,"frame")} set to ${STATUS[action].toLowerCase()}`); return; }
    if(action === "pick" || action === "unpick"){ await each(id=>photoRef(A,id).update({ pick: action === "pick" })); return; }
    if(action === "cat"){ const n = await each(id=>photoRef(A,id).update({ category: value })); toast(`${plural(n,"frame")} moved`); return; }
    if(action === "retouch"){ toast(`Retouching ${plural(ids.length,"frame")}…`); const n = await each(id=>retouchAgain(A, id, value)); toast(`${plural(n,"frame")} retouched`); return; }
    if(action === "tag"){ AI.enqueue(ids.filter(id=>S.photos.get(id).kind !== "video").map(pid=>({ albumId: A, pid }))); toast("Sent to Claude"); return; }
    if(action === "zip"){
      if(ids.length > MAX_ZIP){ toast(`Pick up to ${MAX_ZIP} frames per download.`); return; }
      ctrl.disabled = true; ctrl.textContent = "Packing…";
      try{ const entries = []; for(const id of ids){ const p = S.photos.get(id); entries.push({ name: p.name || id + ".jpg", blob: await fetchBlob(p.sourceId || p.assetId) }); }
        await saveFile(`${(Console.album().slug)}-originals-${fileStamp()}.zip`, await makeZip(entries)); }
      catch{ toast("Some originals couldn’t be loaded."); }
      ctrl.disabled = false; ctrl.textContent = "Download"; return;
    }
    if(action === "delete"){
      if(!(await confirmDialog(`Delete ${plural(ids.length,"frame")}?`, "They’re removed for everyone, including guests who already have the gallery open. This can’t be undone.", "Delete frames", true))) return;
      const n = await each(id=>deletePhoto(A,id)); Console.sel.clear(); toast(`${plural(n,"frame")} deleted`); return;
    }
  }
};

function lookSig(a){ return JSON.stringify([a.title, a.date, a.venue, a.brand, a.categories]); }
function photoMatches(p, q, album){
  const toks = q.toLowerCase().split(/[\s,]+/).filter(Boolean); if(!toks.length) return true;
  const ai = p.ai || {}; const hay = [ai.caption, ...(ai.tags||[]), ...(ai.outfits||[]), catName(album, p.category)].join(" ").toLowerCase();
  const nums = (ai.numbers||[]).map(n=>String(n).toLowerCase());
  return toks.every(t => nums.includes(t) || hay.includes(t));
}
