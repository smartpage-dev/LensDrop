    const p = Object.assign({ id: this.lb.id }, S.photos.get(this.lb.id)); const fr = $("#lbFrame");
    const token = Symbol(); this.lb.token = token;
    if(p.kind === "video"){ fr.innerHTML = `<video src="${blobUrl(p.assetId)}" poster="${blobUrl(p.thumbId)}" controls playsinline></video>`; }
    else{
      fr.innerHTML = `<img src="${blobUrl(p.thumbId)}" alt="${esc((p.ai && p.ai.caption) || "Photo")}">`;
      const full = new Image(); full.onload = async ()=>{ if(this.lb && this.lb.token === token){ const i = $("img", fr); if(i) i.src = full.src; fr.insertAdjacentHTML("beforeend", await wmOverlayHTML(album)); } }; full.src = blobUrl(p.assetId);
    }
    $("#lbCap").textContent = (p.ai && p.ai.caption) || "";
    this.lbCount(); Track.bump("view", p.id);
  },
  lbCount(){ const album = this.album(); if(!album || !this.lb) return; const vis = this.filtered(album, this.list(album)); const i = vis.findIndex(p=>p.id===this.lb.id); $("#lbCount").textContent = i >= 0 ? `${i+1} of ${vis.length}` : ""; },
  step(d){ const album = this.album(); if(!album || !this.lb) return; const vis = this.filtered(album, this.list(album)); if(!vis.length) return; let i = vis.findIndex(p=>p.id===this.lb.id); i = (i + d + vis.length) % vis.length; this.lb.id = vis[i].id; this.showLB(album); },
  closeLB(){ if(!this.lb) return; document.removeEventListener("keydown", this.lb.keys); this.lb.el.remove(); const back = this.lb.last; this.lb = null; if(back && back.focus) back.focus(); },
  async download(){
    const album = this.album(); const p = Object.assign({ id: this.lb.id }, S.photos.get(this.lb.id)); const b = $("#lbDl"); b.disabled = true; b.textContent = "Preparing…";
    try{ const blob = await downloadableBlob(p, album); const ext = p.kind === "video" ? (p.name.split(".").pop() || "mp4") : "jpg"; if(await saveFile(`${album.slug}-${baseName(p.name)}.${ext}`, blob)) Track.bump("dl", p.id); }
    catch{ toast("This photo couldn’t be loaded."); }
    b.disabled = false; b.textContent = "Download";
  },
  async copyLink(){ const album = this.album(); const link = galleryLink(album, this.lb.id); try{ await navigator.clipboard.writeText(link); toast("Link copied"); }catch{ showLinkDialog(link); } },
  posterDialog(){
    const album = this.album(); const p = Object.assign({ id: this.lb.id }, S.photos.get(this.lb.id));
    const d = document.createElement("dialog"); d.style.width = "min(460px, calc(100% - 24px))";
    d.innerHTML = `<h2>Make a poster</h2><div class="seg" id="pfmt" style="margin-bottom:12px"><button data-v="post" aria-pressed="true">Post 4:5</button><button data-v="story" aria-pressed="false">Story 9:16</button></div><div id="pprev" style="background:var(--paper-3);min-height:200px;display:grid;place-items:center"><p class="muted small">Drawing…</p></div><div class="actions"><button class="btn ghost" id="pclose">Close</button><button class="btn" id="psave" disabled>Save poster</button></div>`;
    document.body.appendChild(d); d.onclose = ()=>{ if(d._url) URL.revokeObjectURL(d._url); d.remove(); };
    let blob = null, fmt = "post";
    const draw = async ()=>{ $("#psave", d).disabled = true; try{ blob = await renderPoster(album, p, fmt); if(d._url) URL.revokeObjectURL(d._url); d._url = URL.createObjectURL(blob); $("#pprev", d).innerHTML = `<img src="${d._url}" alt="Poster preview" style="display:block;max-height:56vh;width:auto;margin:0 auto">`; $("#psave", d).disabled = false; }catch{ $("#pprev", d).innerHTML = `<p class="muted small">The poster couldn’t be drawn.</p>`; } };
    $("#pfmt", d).onclick = (e)=>{ const b = e.target.closest("button"); if(!b) return; fmt = b.dataset.v; $$("#pfmt button", d).forEach(x=>x.setAttribute("aria-pressed", x===b)); draw(); };
    $("#pclose", d).onclick = ()=>d.close();
    $("#psave", d).onclick = async ()=>{ if(blob && await saveFile(`${album.slug}-${fmt}-poster.jpg`, blob)) Track.bump("poster"); };
    d.showModal(); draw();
  }
};

function showLinkDialog(link){
  const d = document.createElement("dialog");
  d.innerHTML = `<h2>Copy this link</h2><input class="in" readonly value="${esc(link)}"><div class="actions"><button class="btn">Done</button></div>`;
  document.body.appendChild(d); d.onclose = ()=>d.remove(); $("button", d).onclick = ()=>d.close(); d.showModal(); const i = $("input", d); i.focus(); i.select();
}

/* ============================================================
   Home for people who can’t edit and arrive without a gallery address
   ============================================================ */
const Home = {
  render(){
    const list = [...S.albums.entries()].sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
    const sig = "home:" + list.map(([id,a])=>id+a.slug+a.title+(a.brand&&a.brand.coverId)).join("|") + S.albumsConfirmed;
    if(S.mounted === sig) return; S.mounted = sig; document.title = "Live galleries";
    $("#app").innerHTML = `<div class="home"><h1>Live galleries</h1>${!S.albumsConfirmed ? `<p class="muted">Loading…</p>` : list.length ? `<div class="albums">${list.map(([id,a])=>`<a href="#${esc(a.slug)}"><div class="c" style="${a.brand&&a.brand.coverId?`background-image:url(${blobUrl(a.brand.coverId)})`:`background-color:${esc((a.brand&&a.brand.color)||"#1F3A5F")}`}"></div><b>${esc(a.title)}</b><span class="small muted">${esc([fmtDate(a.date), a.venue].filter(Boolean).join(", "))}</span></a>`).join("")}</div>` : `<p class="muted">No galleries have been published here yet.</p>`}</div>`;
  }
};

/* ============================================================
   Routing and boot
   ============================================================ */
function parseHash(){
  let h = ""; try{ h = decodeURIComponent(location.hash.replace(/^#/,"")); }catch{ h = location.hash.replace(/^#/,""); }
  h = h.trim().toLowerCase(); if(!h || h === "console") return { mode: "", slug: "", pid: "" };
  const i = h.indexOf("--"); return { mode: "gallery", slug: i >= 0 ? h.slice(0,i) : h, pid: i >= 0 ? h.slice(i+2) : "" };
}
function route(){
  const r = parseHash(); const was = S.route; S.route = r;
  if(r.mode !== "gallery" && was.mode === "gallery"){ Gallery.unmount(); }
  if(r.mode === "gallery" && S.mounted === "console"){ Console.unmount(); }
  if(r.mode === "gallery" && was.mode === "gallery" && r.slug !== was.slug){ Gallery.unmount(); S.mounted = ""; }
  scheduleRender();
}
function render(){
  if(!S.db) return;
  if(S.route.mode === "gallery") return Gallery.render();
  if(S.me.canEdit) return Console.render();
  return Home.render();
}
function renderUnavailable(){
  S.mounted = "nodb";
  $("#app").innerHTML = `<div class="state"><h1>Open this gallery in Claude</h1><p>The live gallery keeps its photos in Claude. Open it from its claude.ai link while signed in, and ask the person who shared it for access if photos don’t load.</p></div>`;
}
async function boot(){
  $("#app").innerHTML = `<div class="state"><p class="muted">Connecting…</p></div>`;
  S.route = parseHash();
  const [db, user, assets, downloads, sample] = await Promise.all(["db","user","assets","downloads","sample"].map(cap));
  S.db = db; S.user = user; S.assets = assets; S.downloads = downloads; S.sample = sample;
  if(user){ try{ const [isOwner, canEdit, id] = await Promise.all([user.isOwner(), user.canEdit(), user.id()]); S.me = { isOwner: !!isOwner, canEdit: !!canEdit, id: id || null }; }catch{} }
  if(sample){ try{ const lim = await sample.limits(); S.aiLimits = lim && lim.images ? lim.images : null; S.aiTier = lim && Array.isArray(lim.modelTiers) && lim.modelTiers.includes("quick") ? "quick" : undefined; }catch{ S.aiLimits = null; } }
  if(!db){ renderUnavailable(); return; }
  watchAlbums();
  window.addEventListener("hashchange", route);
  window.addEventListener("scroll", ()=>{ if(window.scrollY < 300 && Gallery.pending){ Gallery.pending = 0; const p = $("#gPill"); if(p) p.hidden = true; } }, { passive: true });
  document.addEventListener("keydown", (e)=>{ if(e.key === "Escape" && Console.drawerId && S.mounted === "console" && !document.querySelector("dialog[open]")) Console.closeDrawer(); });
  window.addEventListener("dragover", (e)=>{ if(S.mounted === "console") e.preventDefault(); });
  window.addEventListener("drop", (e)=>{ if(S.mounted === "console" && !e.target.closest(".drop")) e.preventDefault(); });
  setInterval(()=>{ if(S.mounted && S.mounted.startsWith("gallery:")) Gallery.update(Gallery.album()); else if(S.mounted === "console") Console.updateTop(); }, 20000);
  scheduleRender();
}
boot();
