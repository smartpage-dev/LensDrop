name: LensDrop - Diagnose and Repair H5.12.1 Source
on:
  workflow_dispatch:
    inputs:
      action:
        description: Diagnose or create a repair branch (does not touch main)
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - repair_branch
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Print exact checked out commit
        run: git rev-parse HEAD
      - name: Diagnose and conditionally restore known outdated tests
        env:
          FIX_MODE: ${{ inputs.action }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, json, pathlib, hashlib, base64, zlib, sys
          ROOT = pathlib.Path.cwd()
          MODE = os.environ.get('FIX_MODE','diagnose')
          EXPECTED = {'clients/android/ticket-tests/TicketLedgerTest.java': '34fbd6f7ef5b54ebfca311dc3a465a3e6af298248389bf48699d1bacf5f3b52d', 'clients/android/workflow-tests/ArchiveWorkflowTest.java': 'ca5bd66ce9deab9f96cc405924bb161d29154876112a9e4149bd3d41935697a8'}
          KNOWN_OLD = {'clients/android/ticket-tests/TicketLedgerTest.java': ['e28702600aaa5831b3f6aa9f55d0566ec77b5684ceb6cabb7412d9793f29ef65', 'f015ab84ed6d93a392d7c9ed6a8e7f89fba3968b72290720d15c78a05fa608ac'], 'clients/android/workflow-tests/ArchiveWorkflowTest.java': ['994d4daff850b8bbd20ace7462b6b3ba75f30c8d471adb0211d1b8525c30f445']}
          PAYLOAD = {'clients/android/ticket-tests/TicketLedgerTest.java': '', 'clients/android/workflow-tests/ArchiveWorkflowTest.java': ''}
          assert MODE in ('diagnose','repair_branch')
          def sha(v):
              return hashlib.sha256(v.decode('utf8').replace('\r\n','\n').encode('utf8')).hexdigest()
          m = json.loads((ROOT/'ANDROID_SOURCE_SNAPSHOT_H5_12_1.json').read_text())
          if m.get('release') != 'lensdrop-android-h5.12.1-code18':
              sys.exit('ABORT: unexpected release; no files modified')
          for name,digest in EXPECTED.items():
              if m.get('files',{}).get(name,{}).get('sha256') != digest:
                  sys.exit('ABORT: unexpected manifest for '+name+'; no files modified')
          updates = {}
          for name,digest in EXPECTED.items():
              original = (ROOT/name).read_bytes()
              current = sha(original)
              status = 'CORRECT' if current==digest else ('KNOWN_STALE' if current in KNOWN_OLD[name] else 'UNKNOWN')
              print(f'{name}: {status}\n  current={current}\n  expected={digest}',flush=True)
              if current==digest:
                  continue
              if status=='UNKNOWN':
                  if MODE=='repair_branch':sys.exit('ABORT: unknown remote source variant; download main ZIP and compare')
                  continue
              desired = zlib.decompress(base64.b64decode(PAYLOAD[name]))
              if sha(desired)!=digest:
                  sys.exit('ABORT: package payload failed checksum')
              updates[name]=desired
          if MODE=='diagnose':
              print('DIAGNOSTIC ONLY. No changes or commits were made.')
          else:
              for name,data in updates.items():
                  (ROOT/name).write_bytes(data)
                  print('REPAIRED',name)
              print('REPAIR PRECHECK COMPLETE. Full source verifier runs next.')
          PYCODE
      - name: Verify full source and push separate repair branch
        if: inputs.action == 'repair_branch'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/github/verify_android_snapshot.py
          if git diff --quiet -- clients/android/ticket-tests/TicketLedgerTest.java clients/android/workflow-tests/ArchiveWorkflowTest.java; then
            echo "Already correct. No changes needed."
            exit 0
          fi
          branch="repair/h5121-test-sync-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- clients/android/ticket-tests/TicketLedgerTest.java clients/android/workflow-tests/ArchiveWorkflowTest.java
          git commit -m 'test: restore H5.12.1 schema10 snapshot consistency'
          git push origin "HEAD:refs/heads/$branch"
          sha_local=$(git rev-parse HEAD)
          sha_remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$sha_local" = "$sha_remote"
          echo "## Repair branch pushed (main unchanged)" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $sha_remote" >> "$GITHUB_STEP_SUMMARY"
          echo "Review and merge this branch into main, then start a NEW APK workflow." >> "$GITHUB_STEP_SUMMARY"
