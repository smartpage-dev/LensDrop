name: LensDrop Windows Print Station
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-print-station-${{ github.ref }}
  cancel-in-progress: false
jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Install exact cloud dependency
        run: npm install --prefix cloud --no-audit --no-fund
      - name: Cloud and LAN/cloud station regression tests (no hardware)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          npm --prefix cloud run build 2>&1 | tee ci-output/cloud-build.log
          npm --prefix cloud test 2>&1 | tee ci-output/cloud-tests.log
          node --test clients/print-station/tests/station.test.cjs 2>&1 | tee ci-output/station-tests.log
      - name: Preserve available protocol logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LensDrop-H5-protocol-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ci-output/*.log
          retention-days: 7
          if-no-files-found: warn
  windows-build:
    needs: protocol-tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Compile native worker, test DPAPI round trip, and package portable app
        run: python tools/github/windows_ci.py
      - name: Upload compiled Windows x64 app and checksums
        uses: actions/upload-artifact@v7
        with:
          name: LensDrop-H5-Windows-x64-${{ github.run_number }}
          path: |
            ci-output/LensDrop-PrintStation-H5-win-x64.zip
            ci-output/WINDOWS_BUILD_INFO.json
            ci-output/WINDOWS_SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - name: Upload Windows build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LensDrop-H5-Windows-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ci-output/*.log
          retention-days: 7
          if-no-files-found: warn
