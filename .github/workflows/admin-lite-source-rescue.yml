name: LensDrop Admin Lite - Diagnose or Restore Source
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'diagnose first; restore_branch creates review-only branch, never changes main'
        required: true
        type: choice
        options:
          - diagnose
          - restore_branch
        default: diagnose
permissions:
  contents: write
jobs:
  source_repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Diagnose / restore exact Admin Lite project source
        shell: bash
        env:
          RESTORE_MODE: ${{ inputs.action }}
        run: |
          set -euo pipefail
          python3 - <<'PY_ADMIN_LITE_RESTORE'
          import os, json, base64, hashlib, pathlib, subprocess, sys
          from pathlib import Path
          
          MODE=os.environ.get('RESTORE_MODE','diagnose')
          ROOT=Path.cwd()
          PAYLOAD={'clients/admin-lite/README.md': '', 'clients/admin-lite/settings.gradle': '', 'clients/admin-lite/build.gradle': 'cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgdmVyc2lvbiAnOC45LjEnIGFwcGx5IGZhbHNlIH0K', 'clients/admin-lite/app/build.gradle': '', 'clients/admin-lite/app/src/main/AndroidManifest.xml': '', 'clients/admin-lite/app/src/main/java/app/lensdrop/adminlite/MainActivity.java': '', '.github/workflows/admin-lite-android.yml': '', 'CLOUD_STATION_SOURCE_SNAPSHOT_H5_12_1.json': ''}
          EXPECTED={'clients/admin-lite/README.md': '6c3997fbb4e5b6c74bfb333c5b420a348abf72fae6255b04b7ce581932fbc8b1', 'clients/admin-lite/settings.gradle': '4f4cf9bc0ae4d352da596c6a516049c23e6d91dbb5a8b2ec6a09ecd39ffea82e', 'clients/admin-lite/build.gradle': '7c2248fd2eddd20ccc0da72abb80cfb4beab12b2ec71cc022b36746df856290a', 'clients/admin-lite/app/build.gradle': '410b14e203557200e2b000029054faf3bae5d0fbd115f74a644f324ff7111cbb', 'clients/admin-lite/app/src/main/AndroidManifest.xml': 'ee969c5f5a9c2790118a159eef1d19d3e80eadb1e058de099bb5d39925ebce02', 'clients/admin-lite/app/src/main/java/app/lensdrop/adminlite/MainActivity.java': '6e2f8a8947779a08f2e9d0d07b043d449320ae8b75b01f5b7c0faf229a4589ad', '.github/workflows/admin-lite-android.yml': 'bcc13d1323c88fa882f1e843dc9f3948ba5f5e5b55bac8b12c5e834df3dc1e1a', 'CLOUD_STATION_SOURCE_SNAPSHOT_H5_12_1.json': '077f034c5c8fa55b68fde6a6db3bbde72e052b61c09363d7f907518b81b592ea'}
          ACCEPTED_PREVIOUS={'clients/admin-lite/README.md': [], 'clients/admin-lite/settings.gradle': [], 'clients/admin-lite/build.gradle': [], 'clients/admin-lite/app/build.gradle': [], 'clients/admin-lite/app/src/main/AndroidManifest.xml': [], 'clients/admin-lite/app/src/main/java/app/lensdrop/adminlite/MainActivity.java': [], '.github/workflows/admin-lite-android.yml': ['124ad41daeba5e60f446e03135c77349059b421bd0d0be644296add3a6daa767', 'f3906df189ed4ade3b828fd9cdda69dbcef7db9d06e899b72e2abaf95ae161b3'], 'CLOUD_STATION_SOURCE_SNAPSHOT_H5_12_1.json': ['45aeba5557e7b6320506a6fb2304b878b23ddc172b56665c0de2eb9287ad3b80', '6b6f5c4b8ff88a509c80e3710f0e54532a4f6c7cd22298a1e3a8d47cb06e21cd']}
          FILES=list(PAYLOAD.keys())
          MANIFEST='CLOUD_STATION_SOURCE_SNAPSHOT_H5_12_1.json'
          WORKFLOW='.github/workflows/admin-lite-android.yml'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          
          def git(*args):
              return subprocess.run(['git',*args],check=True,text=True,stdout=subprocess.PIPE).stdout.strip()
          
          def report(message):
              print(message,flush=True)
              summ=os.environ.get('GITHUB_STEP_SUMMARY')
              if summ:
                  with open(summ,'a',encoding='utf-8') as f:f.write(message+'\n')
          
          assert MODE in ('diagnose','restore_branch'), 'Unknown mode'
          assert (ROOT/'cloud').is_dir() and (ROOT/'clients/android').is_dir(), 'Not the LensDrop repository root'
          report('LensDrop Admin Lite source check')
          report('Checked out Git commit: '+git('rev-parse','HEAD'))
          report('Mode: '+MODE)
          for p,b64 in PAYLOAD.items():
              assert sha(base64.b64decode(b64,validate=True))==EXPECTED[p], 'Damaged embedded source: '+p
          
          current={}; issues=[]; blocked=[]; changes=[]
          for p in FILES:
              target=ROOT/p
              if target.is_symlink() or any(q.is_symlink() for q in list(target.parents) if q != ROOT.parent and q != Path('/')):
                  blocked.append((p,'SYMLINK'))
                  continue
              h=sha(target.read_bytes()) if target.is_file() else None
              current[p]=h
              status='OK' if h==EXPECTED[p] else ('MISSING' if h is None else ('KNOWN_PREVIOUS' if h in ACCEPTED_PREVIOUS[p] else 'UNKNOWN_MODIFIED'))
              report('  '+status+' '+p+' actual='+str(h or '-')[:12]+' expected='+EXPECTED[p][:12])
              if status!='OK':
                  issues.append((p,status))
                  if status=='UNKNOWN_MODIFIED':blocked.append((p,status))
                  else:changes.append(p)
          
          if MODE=='diagnose':
              report('Diagnosis only; no files, commits, or branches changed.')
              report('Mismatch count: '+str(len(issues)))
              sys.exit(0)
          
          assert os.environ.get('GITHUB_REF_NAME')=='main', 'For safe restore run this workflow from main only'
          if blocked:
              report('STOP: unrecognized modifications or symlink; do not overwrite: '+repr(blocked));sys.exit(2)
          if not changes:
              report('All eight Admin Lite files already match; nothing to repair.');sys.exit(0)
          
          # Check the rest of the known Cloud/Station source BEFORE altering files.
          manifest_doc=json.loads(base64.b64decode(PAYLOAD[MANIFEST]))
          other_bad=[]
          for p,expected_hash in manifest_doc['files'].items():
              if p in FILES:continue
              f=ROOT/p
              actual=sha(f.read_bytes()) if f.is_file() else None
              if actual!=expected_hash:other_bad.append(p)
          if other_bad:
              report('STOP: more source mismatches outside the eight-file repair scope ('+str(len(other_bad))+'):')
              for p in other_bad[:25]:report('  '+p)
              sys.exit(3)
          
          branch='repair/admin-lite-source-'+os.environ.get('GITHUB_RUN_ID','local')+'-'+os.environ.get('GITHUB_RUN_ATTEMPT','1')
          git('switch','-c',branch)
          for p in changes:
              f=ROOT/p
              f.parent.mkdir(parents=True,exist_ok=True)
              f.write_bytes(base64.b64decode(PAYLOAD[p],validate=True))
          
          # Full current manifest verification including the restored six source files and old workflows.
          missing=[]
          for p,expected_hash in manifest_doc['files'].items():
              f=ROOT/p
              if not f.is_file() or sha(f.read_bytes())!=expected_hash:missing.append(p)
          if missing:
              report('STOP: manifest verification failed: '+repr(missing[:30]));sys.exit(4)
          for p in FILES:
              f=ROOT/p
              if not f.is_file() or sha(f.read_bytes())!=EXPECTED[p]:
                  report('STOP: embedded source mismatch '+p);sys.exit(4)
          
          git('add','--',*FILES)
          for p in FILES:
              data=subprocess.run(['git','show',':'+p],check=True,stdout=subprocess.PIPE).stdout
              if sha(data)!=EXPECTED[p]:raise RuntimeError('Git INDEX does not contain repaired source: '+p)
          
          git('config','user.name','LensDrop CI Repair Bot')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','Restore complete Admin Lite source and preflight in review branch')
          for p in FILES:
              data=subprocess.run(['git','show','HEAD:'+p],check=True,stdout=subprocess.PIPE).stdout
              if sha(data)!=EXPECTED[p]:raise RuntimeError('Git HEAD does not contain repaired source: '+p)
          report('PASS: eight required files in Git index and new commit; Cloud/Station 130-file manifest verified')
          report('Created repair commit: '+git('rev-parse','HEAD'))
          report('Pushing review-only branch (main remains unchanged): '+branch)
          git('push','origin','HEAD:refs/heads/'+branch)
          report('SUCCESS. Open GitHub Pull Request: '+branch+' -> main. Review before merging. Then run a NEW Admin Lite APK build on the merged commit.')
          PY_ADMIN_LITE_RESTORE
