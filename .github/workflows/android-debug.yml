name: LensDrop Android APK

# Manual only: publishing source will NOT automatically spend runner time.
# The workflow must be committed to the default branch to show Run workflow.
on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: 'Temporary key for disposable trials, or persistent key from your repository secret'
        type: choice
        required: true
        default: temporary-test
        options:
          - temporary-test
          - persistent-test
      accept_android_sdk_licenses:
        description: 'I accept the Android SDK licenses for this build (required)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SIGNING_MODE: ${{ inputs.signing_mode }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare output and validate choices
        env:
          ACCEPT_ANDROID_SDK_LICENSES: ${{ inputs.accept_android_sdk_licenses }}
        run: python3 tools/github/android_ci.py prepare

      - name: Verify complete Android source snapshot (no mixed versions)
        run: |
          set -o pipefail
          python3 tools/github/verify_android_snapshot.py --report ci-output/android-source-integrity.json 2>&1 | tee ci-output/android-source-integrity.log

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.11.1 (the H5 package has no Gradle wrapper)
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false

      - name: Prepare the matching Android SDK
        env:
          ACCEPT_ANDROID_SDK_LICENSES: ${{ inputs.accept_android_sdk_licenses }}
        run: |
          set -o pipefail
          python3 tools/github/android_ci.py sdk 2>&1 | tee ci-output/sdk-setup.log

      - name: Restore an optional persistent PRIVATE TEST signing key
        env:
          LENSDROP_TEST_KEYSTORE_BASE64: ${{ secrets.LENSDROP_TEST_KEYSTORE_BASE64 }}
        run: python3 tools/github/android_ci.py signing

      - name: Run H5 queue and policy logic tests (not Android instrumentation)
        run: |
          set -o pipefail
          bash clients/android/RUN_BUILD_INTEGRITY_TESTS.sh 2>&1 | tee ci-output/source-regression-tests.log
          bash clients/android/RUN_POLICY_TESTS.sh 2>&1 | tee ci-output/policy-tests.log
          bash clients/android/RUN_PRINT_POLICY_TESTS.sh 2>&1 | tee ci-output/print-policy-tests.log
          bash clients/android/RUN_PRINT_PROFILE_TESTS.sh 2>&1 | tee ci-output/print-profile-tests.log
          bash clients/android/RUN_LEDGER_TESTS.sh 2>&1 | tee ci-output/ledger-tests.log
          bash clients/android/RUN_TICKET_TESTS.sh 2>&1 | tee ci-output/ticket-tests.log
          bash clients/android/RUN_RELIABILITY_TESTS.sh 2>&1 | tee ci-output/reliability-tests.log
          bash clients/android/RUN_WORKFLOW_TESTS.sh 2>&1 | tee ci-output/archive-workflow-tests.log
          bash clients/android/RUN_GALLERY_TESTS.sh 2>&1 | tee ci-output/gallery-tests.log
          bash clients/android/RUN_GALLERY_UI_TESTS.sh 2>&1 | tee ci-output/gallery-ui-contracts.log
          bash clients/android/SLIDESHOW_QR_TEST.sh 2>&1 | tee ci-output/slideshow-ticket-tests.log
          python3 clients/android/slideshow-tests/check_slideshow_ui.py 2>&1 | tee ci-output/slideshow-ui-contracts.log
          bash clients/android/RUN_UI_SETUP_TESTS.sh 2>&1 | tee ci-output/ui-setup-tests.log

      - name: Compile APK and run Android lint (required)
        working-directory: clients/android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug :app:lintDebug 2>&1 | tee ../../ci-output/android-build.log

      - name: Verify APK signature and prepare download
        run: python3 tools/github/android_ci.py collect

      - name: Upload verified debug APK and provenance
        uses: actions/upload-artifact@v7
        with:
          name: LensDrop-H5-APK-${{ github.run_number }}-${{ inputs.signing_mode }}
          path: |
            ci-output/LensDrop-H5-debug.apk
            ci-output/BUILD_INFO.json
            ci-output/SHA256SUMS.txt
            ci-output/README_INSTALL.txt
            ci-output/apk-verification.txt
            ci-output/android-source-integrity.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload available build logs (also on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LensDrop-H5-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ci-output/*.log
            ci-output/android-source-integrity.json
            clients/android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

      - name: Remove runner signing key
        if: always()
        run: |
          if [ -f tools/github/android_ci.py ]; then
            python3 tools/github/android_ci.py cleanup
          fi
