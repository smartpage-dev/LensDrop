name: LensDrop Admin Lite APK
on:
  workflow_dispatch:
    inputs:
      accept_android_sdk_licenses:
        type: boolean
        required: true
        default: false
        description: 'I accept Android SDK licenses for this test build'
permissions:
  contents: read
jobs:
  build:
    if: ${{ inputs.accept_android_sdk_licenses }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up current Android command-line SDK (no deprecated tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK
        working-directory: clients/admin-lite
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload isolated Admin Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: LensDrop-Admin-Lite-DEBUG-APK
          path: clients/admin-lite/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
