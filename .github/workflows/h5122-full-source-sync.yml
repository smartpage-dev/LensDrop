          def sha(b): return hashlib.sha256(b).hexdigest()
          def git(*args, cwd=None, check=True):
              result=subprocess.run(['git',*args], cwd=cwd, stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
              if check and result.returncode:
                  raise RuntimeError('git '+ ' '.join(args[:3]) + ' failed: ' + result.stderr.decode('utf-8','replace')[-1000:])
              return result.stdout.decode('utf-8','replace').strip()
          def gitbytes(*args, cwd=None):
              r=subprocess.run(['git',*args],cwd=cwd,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if r.returncode:raise RuntimeError('git show could not retrieve committed file: '+' '.join(args[-1:]))
              return r.stdout
          
          def main():
              ap=argparse.ArgumentParser(description='Verify and safely synchronize the 21 H5.12.2 source paths')
              ap.add_argument('repo',nargs='?',default='.',help='Git repo path')
              group=ap.add_mutually_exclusive_group()
              group.add_argument('--apply',action='store_true',help='Stage safe source corrections on a new local branch (never commits)')
              group.add_argument('--check-head',action='store_true',help='Check actual HEAD commit against all 130 tracked source hashes')
              args=ap.parse_args()
              repo=pathlib.Path(args.repo).expanduser().resolve()
              try:
                  real=pathlib.Path(git('rev-parse','--show-toplevel',cwd=repo)).resolve()
                  if real!=repo: raise RuntimeError('Pass the exact Git repository root')
                  if args.apply: mode='apply_local'
                  elif args.check_head: mode='check_head'
                  else: mode=os.environ.get('SYNC_MODE','diagnose')
                  if mode not in ('diagnose','apply_local','check_head','restore_branch'):raise RuntimeError('Unsupported mode: '+mode)
                  if mode=='restore_branch' and os.environ.get('GITHUB_REF_NAME')!='main':
                      raise RuntimeError('GitHub review-branch restore must be started from main')
                  manifest_bytes=(repo/MANIFEST).read_bytes()
                  if sha(manifest_bytes)!=EXPECTED_MANIFEST_SHA:raise RuntimeError('UNRECOGNIZED manifest: stop; do not overwrite current source')
                  manifest=json.loads(manifest_bytes)['files']
                  if len(manifest)!=130:raise RuntimeError('Expected a 130-file Cloud/Station manifest')
                  data=json.loads(zlib.decompress(base64.b64decode(PAYLOAD_B64)).decode('utf-8'))
                  payload={p:base64.b64decode(b,validate=True) for p,b in data.items()}
                  if set(payload)!=set(EXPECTED):raise RuntimeError('Payload scope differs from the approved 21 target files')
                  if any(sha(payload[p])!=EXPECTED[p] or manifest.get(p)!=EXPECTED[p] for p in EXPECTED):
                      raise RuntimeError('Embedded source or version manifest has been modified')
                  statuses={}
                  other=[]
                  unknown=[]
                  for p,correct in manifest.items():
                      path=repo/p
                      if path.is_symlink() or any(parent.is_symlink() for parent in list(path.parents) if parent!=repo and repo in parent.parents):
                          raise RuntimeError('Unexpected symlink in repository source path: '+p)
                      raw=path.read_bytes() if path.is_file() else None
                      actual=sha(raw) if raw is not None else None
                      if actual==correct: status='OK'
                      elif p in EXPECTED:
                          status='MISSING' if actual is None else ('KNOWN_PREVIOUS' if actual in KNOWN_PREVIOUS[p] else 'UNKNOWN_MODIFIED')
                          if status=='UNKNOWN_MODIFIED':unknown.append((p,actual))
                      else:
                          status='UNEXPECTED_OUTSIDE_SCOPE'
                          other.append(p)
                      statuses[p]=(status,actual)
                  print('Git HEAD:',git('rev-parse','HEAD',cwd=repo))
                  print('Mode:',mode,'| Manifest: 130 entries | Approved payload: 21 files')
                  if mode=='check_head':
                      head_bad=[]
                      for p,h in manifest.items():
                          try:d=gitbytes('show','HEAD:'+p,cwd=repo)
                          except RuntimeError:head_bad.append((p,'MISSING_IN_HEAD'));continue
                          if sha(d)!=h:head_bad.append((p,'STALE_IN_HEAD'))
                      print('HEAD source verification:',str(len(manifest)-len(head_bad))+'/130')
                      for p,st in head_bad[:50]:print('  '+st+' '+p)
                      if head_bad:sys.exit(5)
                      print('PASS: HEAD commit fully matches 130-file source snapshot')
                      return
                  for p,(state,digest) in statuses.items():
                      if state!='OK':print('  '+state+' '+p+' actual='+str(digest or '-')[:12])
                  print('Summary: corrected=',sum(1 for s,_ in statuses.values() if s=='OK'),'needs_update=',sum(1 for s,_ in statuses.values() if s!='OK'))
                  if mode=='diagnose':
                      print('DIAGNOSE ONLY: no changes, no commits, no remote push.')
                      if unknown:print('UNKNOWN local edits require review; request a fresh GitHub ZIP before replacing.')
                      return
                  if other:
                      raise RuntimeError('STOP: mismatches outside known 21-file repair: '+', '.join(other[:20]))
                  if unknown:
                      raise RuntimeError('STOP: unknown modifications (not present in prior release baselines): '+', '.join(p+'='+str(h)[:12] for p,h in unknown))
                  if git('status','--porcelain',cwd=repo):
                      raise RuntimeError('STOP: worktree not clean. Commit or stash user changes on a separate branch before restore.')
                  branch=git('branch','--show-current',cwd=repo)
                  if mode=='apply_local' and (not branch or branch in ('main','master')):
                      raise RuntimeError('STOP: create a NEW review branch before local apply; never write into main.')
                  if mode=='restore_branch':
                      branch='repair/h5122-all-source-'+os.environ.get('GITHUB_RUN_ID','manual')+'-'+os.environ.get('GITHUB_RUN_ATTEMPT','1')
                      git('switch','-c',branch,cwd=repo)
                  changes=[p for p in EXPECTED if statuses[p][0]!='OK']
                  for p in changes:
                      f=repo/p
                      f.parent.mkdir(parents=True,exist_ok=True)
                      f.write_bytes(payload[p])
                  if changes:
                      git('add','-f','--',*changes,cwd=repo)
                  for p,h in manifest.items():
                      f=repo/p
                      if not f.is_file() or sha(f.read_bytes())!=h:
                          raise RuntimeError('POST-CHECK: source files mismatch after write: '+p)
                      if p in changes:
                          if sha(gitbytes('show',':'+p,cwd=repo))!=h:
                              raise RuntimeError('POST-CHECK: staged Git index bytes differ: '+p)
                  print('PASS: 130/130 source files match; staged exact repair targets:',len(changes))
                  if mode=='apply_local':
                      print('READY FOR COMMIT on review branch:',branch)
                      print('Commit these staged files, then run: python SYNC_SOURCE.py <repo> --check-head')
                      return
                  # GitHub Actions: push new review-only branch, never modify main.
                  if not changes:
                      print('NO CHANGES NEEDED. Current source snapshot already matches.')
                      return
                  git('config','user.name','LensDrop Source Repair Bot',cwd=repo)
                  git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com',cwd=repo)
                  git('commit','-m','Sync H5.12.2 Ops UI Admin Lite source with approved manifest',cwd=repo)
                  for p,h in manifest.items():
                      if sha(gitbytes('show','HEAD:'+p,cwd=repo))!=h:
                          raise RuntimeError('HEAD COMMIT FAIL: '+p)
                  git('push','origin','HEAD:refs/heads/'+branch,cwd=repo)
                  print('SUCCESS: 130/130 source hashes present in review commit',git('rev-parse','HEAD',cwd=repo))
                  print('REVIEW BRANCH:',branch)
                  print('Create a Pull Request to main, review all source changes, then merge and run a NEW Admin Lite APK workflow.')
              except Exception as exc:
                  print('STOP:',str(exc),file=sys.stderr)
                  sys.exit(2)
          if __name__=='__main__':main()
          PY_LD_SYNC
