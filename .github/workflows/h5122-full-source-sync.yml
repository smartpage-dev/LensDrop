name: LensDrop - Full H5.12.2 Source Sync
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose (read-only) or restore_branch (create review branch)"
        type: choice
        required: true
        default: diagnose
        options:
          - diagnose
          - restore_branch
permissions:
  contents: write
jobs:
  source_sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
